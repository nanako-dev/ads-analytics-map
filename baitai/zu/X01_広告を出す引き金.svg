<svg viewBox="0 0 860 478" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="x01t x01d" class="fig">
<title id="x01t">X01 広告を出す引き金</title>
<desc id="x01d">Google は検索語句、Meta は人（見ている人の中からオーディエンス条件の範囲で配信システムが選ぶ）、LINEヤフーは検索なら検索語句・ディスプレイなら人と文脈、ChatGPT は会話の文脈と意図で広告が出る。Meta には検索語句が、ChatGPT にはキーワードが無く、ChatGPT の文脈ヒント（広告グループあたり最大 2,000）は完全一致のキーワードではなく配信も保証しないので、「この語で出す・外す」の設計は Google と LINEヤフーの検索でしかできない。</desc>
