<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 534" role="img" aria-labelledby="X04-t X04-d">
<title id="X04-t">計測の部品の対応: Google・Meta・LINEヤフー・ChatGPT</title>
<desc id="X04-d">ブラウザのタグは、Google タグ、Meta ピクセル、LINEヤフーは検索が旧タグ（サイトジェネラルタグ＋コンバージョン測定タグ）でディスプレイが計測タグ、ChatGPT は OpenAI ピクセル。サーバー連携は、Google がサーバーサイド GTM、Meta がコンバージョン API、LINEヤフーは検索用と計測タグ用の 2 つのコンバージョン API、ChatGPT がコンバージョン API。クリックの ID は gclid、fbc、yclid（ディスプレイは記載なし）、oppref。ビュースルーは、Google が既定 1 日でディスプレイでは成果の列に入らない、Meta が 1 日で既定に入る（△）、LINEヤフーのディスプレイが 1 日固定で入らない、ChatGPT が 0〜1 日で 1 日なら入る（△ 開発者文書と食い違い）。</desc>
