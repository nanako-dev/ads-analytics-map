<text x="624.0" y="60.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">再審査で再び却下されたら</text>
<rect x="24.0" y="74.0" width="140.0" height="92.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Google</text>
<rect x="164.0" y="74.0" width="224.0" height="92.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="176.0" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">ほとんど 1 営業日</text>
<text x="176.0" y="124.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">DG は 3〜5 営業日</text>
<text x="176.0" y="146.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">複雑な形式は最長 7 営業日</text>
<rect x="388.0" y="74.0" width="224.0" height="92.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="400.0" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#B42318" text-anchor="start">記載なし</text>
<text x="400.0" y="124.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">承認済みの「再審査中」は</text>
<text x="400.0" y="146.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">止まる（別の場面）</text>
<rect x="612.0" y="74.0" width="224.0" height="92.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="624.0" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">異議は 1 広告 3 回まで</text>
<text x="624.0" y="124.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">通らなければサポートへ</text>
