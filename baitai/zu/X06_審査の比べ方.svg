<text x="176.0" y="194.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">ほとんど 24 時間以内</text>
<text x="176.0" y="216.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">特別な広告カテゴリでも同じ</text>
<rect x="388.0" y="166.0" width="224.0" height="92.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="400.0" y="194.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#B42318" text-anchor="start">記載なし</text>
<text x="400.0" y="216.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">編集した広告は</text>
<text x="400.0" y="238.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">新規として審査される</text>
<rect x="612.0" y="166.0" width="224.0" height="92.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="624.0" y="194.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">同じ広告はもう頼めない</text>
<text x="624.0" y="216.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">表現を変えた新しい広告に</text>
<rect x="24.0" y="258.0" width="140.0" height="92.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="286.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">LINEヤフー</text>
<rect x="164.0" y="258.0" width="224.0" height="92.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="176.0" y="286.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#000000" text-anchor="start">新規は 3 営業日前後</text>
<text x="176.0" y="308.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">画像・動画は広告に</text>
<text x="176.0" y="330.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">設定した日から約 3 営業日</text>
