<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 556" role="img" aria-labelledby="X06-t X06-d">
<title id="X06-t">審査の比べ方: Google・Meta・LINEヤフー・ChatGPT</title>
<desc id="X06-d">4 媒体の審査を、審査の時間、承認済みの広告を編集したときに配信が続くか、再審査で再び却下されたらどうなるか、の 3 つで並べた。審査の時間は、Google がほとんど 1 営業日（デマンド ジェネレーションは 3〜5 営業日、複雑な形式は最長 7 営業日）、Meta がほとんど 24 時間以内、LINEヤフーが新規で 3 営業日前後（画像・動画は広告に設定した日から約 3 営業日）、ChatGPT は記載なし（事業者の認証は最大 7 営業日）。承認済みの広告を編集したとき、LINEヤフーは編集内容審査中も元の内容で配信が続き否認されても元のまま。Google・Meta・ChatGPT は記載なし（Google の承認済みの再審査中は止まるが別の場面、Meta は編集した広告を新規として審査、ChatGPT は新しい版として再審査）。再審査で再び却下されたら、Google は異議が 1 広告 3 回まで、Meta は同じ広告はもう再審査を頼めない、LINEヤフーと ChatGPT は回数の上限の記載なし（LINEヤフーは違反の繰り返し入稿がアカウント停止の理由、ChatGPT は異議が 7 日で決まらなければサポートへ）。</desc>
<defs><marker id="ah-X06" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
