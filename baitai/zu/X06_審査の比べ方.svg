<text x="176.0" y="422.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">最大 7 営業日</text>
<rect x="388.0" y="350.0" width="224.0" height="92.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="400.0" y="378.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#B42318" text-anchor="start">記載なし</text>
<text x="400.0" y="400.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">編集は新しい版として</text>
<text x="400.0" y="422.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">再審査される</text>
<rect x="612.0" y="350.0" width="224.0" height="92.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
