<text x="36.0" y="378.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">ChatGPT</text>
<rect x="164.0" y="350.0" width="224.0" height="92.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="176.0" y="378.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14.5" font-weight="700" fill="#B42318" text-anchor="start">記載なし</text>
