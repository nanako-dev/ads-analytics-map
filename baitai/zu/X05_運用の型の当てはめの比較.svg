<rect x="24.0" y="351.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="360.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">LINEヤフーは名前の置き換えだけのものも「そのまま」に数えた（Meta・ChatGPT は「言い換え」）</text>
