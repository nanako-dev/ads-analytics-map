<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 404" role="img" aria-labelledby="X05-t X05-d">
<title id="X05-t">運用の型の当てはめの比較: Meta・LINEヤフー・ChatGPT</title>
<desc id="X05-d">Google 用に書いた運用の型の規則 175 個を各媒体に当てはめた結果〔当てはめ〕を、同じ物差しの横棒で並べた。Meta はそのまま 53・言い換え 100・使えない 22、LINEヤフーの検索は 85・80・10、LINEヤフーのディスプレイは 55・89・31、ChatGPT は 54・85・36。LINEヤフーは名前の置き換えだけで済むものも「そのまま」に数えていて、Meta と ChatGPT はそれを「言い換え」に数えたので、そのままと言い換えの境目は媒体の間で数え方が違う。</desc>
<defs><marker id="ah-X05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="404.0" fill="#FFFFFF"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">運用の型の規則 175 個（Google 用）を各媒体に当てはめると</text>
<text x="836.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#676E64" text-anchor="end">〔当てはめ〕</text>
<rect x="24.0" y="47.0" width="16.0" height="16.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="46.0" y="60.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">そのまま使える</text>
<rect x="163.0" y="47.0" width="16.0" height="16.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="185.0" y="60.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">言い換えが要る</text>
<rect x="302.0" y="47.0" width="16.0" height="16.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="324.0" y="60.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">使えない</text>
<text x="24.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Meta</text>
