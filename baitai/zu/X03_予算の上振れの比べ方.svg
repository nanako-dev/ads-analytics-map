<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 664" role="img" aria-labelledby="X03-t X03-d">
<title id="X03-t">予算の上振れの比べ方: Google・Meta・LINEヤフー・ChatGPT</title>
<desc id="X03-d">例として 1 日の予算を 1 万円にすると、1 日に使われうる最大は Google・LINEヤフー・ChatGPT が 2 万円、Meta が 1.75 万円（一部のアカウントで段階的のため △）。ならす期間の上限は、Google と LINEヤフー検索が月 30.4 万円、LINEヤフーのディスプレイが 31 日の月で 31 万円、Meta と ChatGPT は週（日曜〜土曜）で 7 万円。</desc>
