<svg viewBox="0 0 860 570" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="x02t x02d" class="fig">
<title id="x02t">X02 「学習」の意味の違い</title>
<desc id="x02d">Google の「学習中」は最長 7 日で終わる時間の表示、Meta の情報収集期間は 1 週間で約 50 件に届くと抜ける件数の関門、LINEヤフーは学習中・学習完了・学習停止の表示と推奨件数（検索は設定後 1 か月以上で 30 件、ROAS 目標値は 50 件）、ChatGPT は公式に学習の記載が無い。比べるときは、何の単位（入札戦略・広告セット・キャンペーン）で何で終わるか（日数・件数・表示）をそろえてから読む。</desc>
