<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 810" role="img" aria-labelledby="X07-t X07-d">
<title id="X07-t">広告文はどこで切れるか: Google・LINEヤフー・Meta・ChatGPT</title>
<desc id="X07-d">4 媒体の見出しと本文について、入る上限を棒の長さ（日本語の全角で何字か）、切れずに出る目安を緑で示した。Google 広告は見出し全角 15 字（半角 30）・説明文 45 字（半角 90）が上限で、何字から「...」になるかは記載なし。公式は画面の幅と字の幅で短くなると書き、画像や電話ボタンが出ると説明文 2 が削られうる。LINEヤフー広告はタイトル 15 字・説明文 45 字（全角は 2 字）が上限で、目安は記載なし。公式に「…」と書くのは表示 URL と、新規作成の終わった拡大テキスト広告のタイトル 2・3 だけ。Meta 広告は推奨の長さだけで、見出し 40 文字（Facebook フィードは 27）、メインテキスト 125 文字（Instagram リールは 44）。入る上限と全角の数え方は記載なしで、推奨を超えると切れうる、配置と端末でさらに省略される。ChatGPT の広告は日本の管理画面で全角も 1 字と数え、タイトルは 32 字まで切れずに出て 50 字まで入る、説明は 54 字まで切れずに出て 100 字まで入る。目安を超えると一部の配置で切れるという警告が出るが、32・54 は公開の文書には書かれていない。</desc>
