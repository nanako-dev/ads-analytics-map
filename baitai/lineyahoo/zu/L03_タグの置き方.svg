<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="L03-t L03-d">
<title id="L03-t">LINEヤフー広告のタグの置き方（2026-11-18 時点）</title>
<desc id="L03-d">旧 Yahoo! の作法では、全ページの head にサイトジェネラルタグを 1 つ置けば検索とディスプレイの両方で動き、成果のページにコンバージョン測定タグを検索用とディスプレイ用に 1 つずつ置く。ディスプレイの新しい本線は計測タグで、全ページにグローバルスニペット、計測したいページにイベントスニペットを足す。検索のサーバー連携は、広告のクリックで URL に付く yclid を自社サーバーで保存して検索のコンバージョン API に送る。yclid が必須で、メールでの照合はできない。</desc>
<defs><marker id="ah-L03" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
