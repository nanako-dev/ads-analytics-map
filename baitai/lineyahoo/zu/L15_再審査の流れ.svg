<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 506" role="img" aria-labelledby="L15-t L15-d">
<title id="L15-t">再審査の頼み方と、承認済みの広告の編集（LINEヤフー）</title>
<desc id="L15-d">否認された広告を直したあとの再審査の頼み方は、直したものによって分かれる。広告文・画像を直したら、編集して保存することが再審査の依頼になる。ディスプレイで LP だけ直したら、広告を編集せずに保存を押す。否認の理由がリンク先についての 1 つだけなら、広告一覧の一括操作で再審査を依頼できる（検索はレスポンシブ検索広告だけ）。動的検索連動型広告とアプリ訴求広告は編集では頼めず、作り直す。公式コラムは、直しただけでは自動では再審査されないと書く。承認済みの広告を編集すると編集内容審査中になり、その間は元の内容で配信が続き、承認されれば新しい内容に、否認なら元のまま。ディスプレイの画像・動画は編集できない。</desc>
