<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="L25-t L25-d">
<title id="L25-t">フレーズ一致: キーワードは語順を問わず、除外は語順を問う（LINEヤフー）</title>
<desc id="L25-d">例はキーワードも対象外キーワードも「液晶 テレビ」。除外の 3 列はヘルプの例で、キーワードの列は同じ語にキーワードの定義を当てた〔当てはめ〕。「液晶 テレビ」はキーワードのフレーズ一致で出て、除外は 3 種とも止まる。「格安 液晶 テレビ」（前後に他の語）はキーワードで出て、除外の完全一致では出る、フレーズ一致と部分一致で止まる。「テレビ 液晶」（語順の入れ替え）はキーワードで出る（意味が変わる入れ替えは除く）が、除外は完全一致とフレーズ一致では止まらず、部分一致でだけ止まる。「液晶とテレビ」（間に他の語）はキーワードで出るかの記載が無く、除外は部分一致でだけ止まる。語順を入れ替えた検索には広告が出るのにフレーズの除外では止まらないので、止めたい語は除外の部分一致で入れる〔推測〕。除外には類似パターンも効かない。</desc>
