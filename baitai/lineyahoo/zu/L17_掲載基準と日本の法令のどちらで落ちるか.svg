<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 738" role="img" aria-labelledby="L17-t L17-d">
<title id="L17-t">掲載基準と日本の法令のどちらで落ちるか（LINEヤフー）</title>
<desc id="L17-d">主な論点を、日本の法律の側と LINEヤフーの審査の側のどちらで落ちうるかで色分けした（判定は書き手の読みで〔推測〕）。両方で落ちうるのは、根拠の無い優位（優良誤認）、No.1・最上級（法は調査の中身、LINEヤフーは表示の形と鮮度）、定期購入の条件（法は最終確認画面まで、LINEヤフーは申し込みの前の導線）、健康食品の効能・部位の暗示、医療の最上級・費用の強調、景表法の行政処分（処分以降は掲載不可）。法の側だけなのは、一般の打消し表示、一般の業種の二重価格、ステマで、LINEヤフーの基準には記載が無いか名指しの項目が無い。LINEヤフーの側だけなのは、「〜でお悩みの方へ」型の書き方、表記（記号・括弧・電話番号）、重複掲載・個人の LINE への誘導。LINEヤフーの承認は法の側で問題が無いことを保証しない。</desc>
