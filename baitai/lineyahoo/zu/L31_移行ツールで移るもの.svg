<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 678" role="img" aria-labelledby="L31-t L31-d">
<title id="L31-t">LINE 広告の移行ツールで移るもの・移らないもの（2026-11-18 時点）</title>
<desc id="L31-d">LINE 広告から LINEヤフー広告 ディスプレイ広告へ、移行ツールで移るのは、キャンペーン・広告グループ・広告の設定、素材、オーディエンスに溜まったユーザー、審査の承認（自動承認）、グループ（MCC へ）と広告アカウント、カード情報と権限（任意）。キャンペーンは配信オフで作られ、承認は移るが移行後に LINEヤフー広告の基準で否認されうる。移らないのは、過去の実績とレポート、自動入札の学習、LINE Tag とコンバージョン設定、「商品フィードから販売」の目的、外部ツールの API 連携、操作履歴と免税設定。計測タグに貼り替えてコンバージョン設定を作り直し、学習は一からになる。</desc>
