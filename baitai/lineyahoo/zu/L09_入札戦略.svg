<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="L09-t L09-d">
<title id="L09-t">検索広告の入札戦略: キャンペーン個別とポートフォリオ</title>
<desc id="L09-d">検索広告の入札戦略を、キャンペーン個別入札設定とポートフォリオ入札設定で選べるかどうかで色分けした。キャンペーン個別では、個別クリック単価・クリック数の最大化・コンバージョン数の最大化・コンバージョン価値の最大化・ページ最上部掲載を選び、目標値（CPA・ROAS）は最大化のオプションで付ける。ポートフォリオでは、クリック数の最大化・ページ最上部掲載と、独立の戦略としての CPA・ROAS の目標値を選べ、最大化の 2 つは使えない。推奨の件数は 30 件、ROAS の目標値は 50 件。</desc>
