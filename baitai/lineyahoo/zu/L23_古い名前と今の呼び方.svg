<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 726" role="img" aria-labelledby="L23-t L23-d">
<title id="L23-t">古い名前・終わったもの → 今の呼び方（LINEヤフー、2026-11-18 時点）</title>
<desc id="L23-d">上から日付の順（縦の間隔は日付の比ではない）。検索: 2024-07-16 に部分一致がインテントマッチに改称（除外は部分一致のまま）。2025-06-30 に検索の拡張クリック単価が提供終了（ディスプレイには残る）。2026-07-29 からデータは抽出日から 37 か月前まで（以前は 11 年）。ディスプレイ: 2025-08 にサーチキーワードターゲティングが終わり、後継は高度なセグメント。2026-04-01 に YDA と LINE 広告がディスプレイ広告に統合（仕様は旧 YDA）。2026-10-26 に LINE 広告（日本向け）が配信停止。2027-01-13 にコンバージョン経路・アトリビューションモデル比較・横断リーチの 3 レポートが終了予定。両方: 2026-04-01 に Yahoo!広告は LINEヤフー広告へ（検索は名前だけ変更）。</desc>
<defs><marker id="ah-L23" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="726.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">古い名前・終わったもの → 今の呼び方</text>
<text x="168.0" y="56.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">検索広告</text>
<text x="510.0" y="56.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">ディスプレイ広告</text>
<text x="24.0" y="102.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2024-07-16</text>
<rect x="168.0" y="68.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="90.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">部分一致</text>
<line x1="178.0" y1="85.0" x2="234.0" y2="85.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="180.0" y="114.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ インテントマッチ（除外は部分一致のまま）</text>
<text x="24.0" y="170.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2025-06-30</text>
<rect x="168.0" y="136.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="158.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">拡張クリック単価（検索）</text>
<line x1="178.0" y1="153.0" x2="338.0" y2="153.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="180.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ 提供終了。ディスプレイには残る</text>
<text x="24.0" y="238.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2025-08</text>
<rect x="510.0" y="204.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="522.0" y="226.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">サーチキーワードターゲティング</text>
<line x1="520.0" y1="221.0" x2="719.0" y2="221.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="522.0" y="250.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ 終了。後継は高度なセグメント</text>
<text x="24.0" y="306.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-04-01</text>
<rect x="168.0" y="272.0" width="668.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="294.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">Yahoo!広告</text>
<line x1="178.0" y1="289.0" x2="254.8" y2="289.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="180.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ LINEヤフー広告（検索は名前だけ変更）</text>
<text x="24.0" y="374.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-04-01</text>
<rect x="510.0" y="340.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="522.0" y="362.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">YDA ＋ LINE 広告</text>
<line x1="520.0" y1="357.0" x2="630.1" y2="357.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="522.0" y="386.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ ディスプレイ広告に統合（仕様は旧 YDA）</text>
<text x="24.0" y="442.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-07-29</text>
<rect x="168.0" y="408.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="430.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">データは 11 年分見られる</text>
<line x1="178.0" y1="425.0" x2="335.9" y2="425.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="180.0" y="454.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ 抽出日から 37 か月前まで</text>
<text x="24.0" y="510.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-10-26</text>
<rect x="510.0" y="476.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="522.0" y="498.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">LINE 広告（日本向け）</text>
<line x1="520.0" y1="493.0" x2="663.4" y2="493.0" stroke="#4D4D4D" stroke-width="1"/>
<text x="522.0" y="522.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ 配信停止。LINE の面もディスプレイ広告で</text>
<rect x="24.0" y="546.0" width="50.0" height="20.0" fill="#19E76E"/>
<text x="31.0" y="561.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">いま</text>
<line x1="80.0" y1="556.0" x2="836.0" y2="556.0" stroke="#0B8F45" stroke-width="1.5"/>
<text x="836.0" y="576.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18</text>
<text x="24.0" y="618.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2027-01-13</text>
<rect x="510.0" y="584.0" width="326.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="5 3"/>
<text x="522.0" y="606.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">経路・アトリビューションモデル比較・横断リーチ</text>
<text x="522.0" y="630.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">→ 3 つのレポートが終了（予定）</text>
<rect x="24.0" y="673.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="682.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">古い手順書・記事の名前は、この対応で読み替えてから引く</text>
<text x="24.0" y="712.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 96 §3 ／ LY-キーワード-002 ／ LY-統合-001・006</text>
</svg>
