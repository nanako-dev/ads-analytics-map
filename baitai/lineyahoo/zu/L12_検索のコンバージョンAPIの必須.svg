<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 572" role="img" aria-labelledby="L12-t L12-d">
<title id="L12-t">検索広告のコンバージョン API で送るもの（LINEヤフー）</title>
<desc id="L12-d">検索広告のクリックで URL に yclid が付き、自社サーバーに保存して、成果のときに検索のコンバージョン API（search-ads-cv.yahooapis.jp/v1、1 リクエストに 1 件）へ送る。照合の鍵は yclid か、sa_p・sa_t・sa_ra の 3 つのどちらかが必須。必須の項目は yahoo_conversion_id・yahoo_conversion_label・event_time・url・user_agent・ip で、url は成果のページ。任意は yahoo_conversion_value・referrer・sa_cc。ハッシュ化したメール・電話の項目は無い。インポートで使う YSS で始まる yclid は発行から 90 日だけ有効で、過ぎて取り込んでも計上されない。200 が返っても不正や重複と判定されたものは計測されない。</desc>
<defs><marker id="ah-L12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="572.0" fill="#FFFFFF"/>
<rect x="24.0" y="24.0" width="191.0" height="62.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告のクリック</text>
<text x="36.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索広告</text>
<line x1="215.0" y1="55.0" x2="230.0" y2="55.0" stroke="#000000" stroke-width="1" marker-end="url(#ah-L12)"/>
<rect x="231.0" y="24.0" width="191.0" height="62.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="243.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">URL に yclid</text>
<text x="243.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">自動タグ設定で付く</text>
<line x1="422.0" y1="55.0" x2="437.0" y2="55.0" stroke="#000000" stroke-width="1" marker-end="url(#ah-L12)"/>
<rect x="438.0" y="24.0" width="191.0" height="62.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="450.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">自社サーバーに保存</text>
<text x="450.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">着地したときに</text>
<line x1="629.0" y1="55.0" x2="644.0" y2="55.0" stroke="#000000" stroke-width="1" marker-end="url(#ah-L12)"/>
<rect x="645.0" y="24.0" width="191.0" height="62.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="657.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">成果のときに送る</text>
<text x="657.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索の CV API へ</text>
<line x1="740.5" y1="86.0" x2="740.5" y2="112.0" stroke="#000000" stroke-width="1" marker-end="url(#ah-L12)"/>
<rect x="24.0" y="112.0" width="812.0" height="36.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="136.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="14" font-weight="700" fill="#000000" text-anchor="start">POST search-ads-cv.yahooapis.jp/v1</text>
<text x="822.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">1 リクエストに 1 件</text>
<text x="38.0" y="184.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">照合の鍵</text>
