<rect x="24.0" y="519.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="528.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">200 が返っても、不正な値・重複と判定されたものは計測されない</text>
