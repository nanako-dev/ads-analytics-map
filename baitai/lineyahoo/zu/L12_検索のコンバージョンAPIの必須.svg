<rect x="389.5" y="166.0" width="50.2" height="26.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="398.5" y="183.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">sa_t</text>
<rect x="447.8" y="166.0" width="58.3" height="26.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="456.8" y="183.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">sa_ra</text>
<text x="516.1" y="184.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">の 3 つ</text>
<text x="38.0" y="224.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">必須</text>
<rect x="214.0" y="206.0" width="171.1" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="223.0" y="223.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">yahoo_conversion_id</text>
<rect x="393.1" y="206.0" width="195.3" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="402.1" y="223.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">yahoo_conversion_label</text>
<rect x="596.5" y="206.0" width="98.6" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="605.5" y="223.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">event_time</text>
<rect x="214.0" y="240.0" width="42.2" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="223.0" y="257.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">url</text>
<rect x="264.2" y="240.0" width="98.6" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="273.2" y="257.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">user_agent</text>
<rect x="370.8" y="240.0" width="34.1" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="379.8" y="257.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ip</text>
<text x="418.9" y="258.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">url は成果のページ</text>
<text x="38.0" y="298.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">任意</text>
<rect x="214.0" y="280.0" width="195.3" height="26.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/><text x="223.0" y="297.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">yahoo_conversion_value</text>
<rect x="417.3" y="280.0" width="82.5" height="26.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/><text x="426.3" y="297.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">referrer</text>
<rect x="507.8" y="280.0" width="58.3" height="26.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/><text x="516.8" y="297.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="400" fill="#000000" text-anchor="start">sa_cc</text>
