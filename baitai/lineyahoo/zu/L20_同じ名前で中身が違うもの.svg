<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 773" role="img" aria-labelledby="L20-t L20-d">
<title id="L20-t">同じ名前で中身が違うもの: 数字を読み違えやすい 7 つ（LINEヤフー）</title>
<desc id="L20-d">思い込みと実際の対。損失率（予算）が高いと予算不足と思いがちだが、検索の損失率（予算）には入札価格と残高による損失も入り、予算で止まると広告グループの損失率（ランク）は 0.00 と出る。品質インデックスは完全一致が前提の参考値で、マッチタイプも対象外キーワードも数字に入らない。コンバージョン数には推定コンバージョンが合算され、抜き出しも除外もできない。計上日はきっかけのクリックの日で、複数のクリックなら最後のクリックの日。月の請求限度額は検索が日予算 × 30.4、ディスプレイは日予算 × その月の日数で、配信オフや否認で出ない日も数える。学習期間の日数は検索では記載が無く、ディスプレイの 7 日は見直す線。「自動入札への利用：しない」の成果も、キャンペーン単位でコンバージョングループを指定すると入札に使われる。</desc>
<defs><marker id="ah-L20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="773.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">同じ名前で中身が違うもの: 数字を読み違えやすい 7 つ</text>
<text x="24.0" y="64.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">思い込み</text>
<text x="414.0" y="64.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">実際</text>
<rect x="24.0" y="76.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="94.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索</text>
<text x="36.0" y="116.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">損失率（予算）が高い ＝ 予算が足りない</text>
<line x1="368.0" y1="115.5" x2="408.0" y2="115.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="76.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="109.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">入札価格と残高による損失も入る</text>
<text x="426.0" y="130.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">予算で止まると、広告グループの損失率（ランク）は 0.00</text>
<rect x="24.0" y="165.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="183.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索</text>
<text x="36.0" y="205.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">品質インデックスは、マッチタイプや</text>
<text x="36.0" y="226.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">除外を整理すると上がる</text>
<line x1="368.0" y1="204.5" x2="408.0" y2="204.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="165.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="198.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">完全一致が前提の参考値</text>
<text x="426.0" y="219.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">マッチタイプも対象外キーワードも数字に入らない</text>
<rect x="24.0" y="254.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="272.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索・ディスプレイ</text>
<text x="36.0" y="294.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">「コンバージョン数」はタグで測った件数</text>
<line x1="368.0" y1="293.5" x2="408.0" y2="293.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="254.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="287.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">推定コンバージョンが合算されている</text>
<text x="426.0" y="308.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">抜き出しも除外もできない</text>
<rect x="24.0" y="343.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="361.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索・ディスプレイ</text>
<text x="36.0" y="383.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">計上日は Google と同じ「クリックの日」</text>
<line x1="368.0" y1="382.5" x2="408.0" y2="382.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="343.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="376.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">きっかけのクリックの日</text>
<text x="426.0" y="397.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">複数のクリックなら、最後のクリックの日</text>
<rect x="24.0" y="432.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="450.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">ディスプレイ</text>
<text x="36.0" y="472.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">月の請求限度額は、どちらも日予算 × 30.4</text>
<line x1="368.0" y1="471.5" x2="408.0" y2="471.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="432.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="465.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">ディスプレイは日予算 × その月の日数</text>
<text x="426.0" y="486.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">配信オフ・否認で出ない日も数える</text>
<rect x="24.0" y="521.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="539.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索・ディスプレイ</text>
<text x="36.0" y="561.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">学習は 7 日で終わり、そこから評価してよい</text>
<line x1="368.0" y1="560.5" x2="408.0" y2="560.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="521.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="554.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#B42318" text-anchor="start">検索: 学習期間の日数は記載なし</text>
<text x="426.0" y="575.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">ディスプレイ: 7 日は「見直す線」</text>
<rect x="24.0" y="610.0" width="340.0" height="79.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="628.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">検索</text>
<text x="36.0" y="650.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">「自動入札への利用：しない」の成果は</text>
<text x="36.0" y="671.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">入札に使われない</text>
<line x1="368.0" y1="649.5" x2="408.0" y2="649.5" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L20)"/>
<rect x="414.0" y="610.0" width="422.0" height="79.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="426.0" y="643.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">コンバージョングループを指定すると使われる</text>
<text x="426.0" y="664.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">（キャンペーン単位の設定）</text>
<rect x="24.0" y="720.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="729.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Google と同じ名前でも、まず検索かディスプレイかを決めてから読む</text>
<text x="24.0" y="759.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 90 §10 ／ LY-計測-005・008・009</text>
</svg>
