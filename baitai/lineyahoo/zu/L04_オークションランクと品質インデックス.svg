<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 552" role="img" aria-labelledby="L04-t L04-d">
<title id="L04-t">オークションランクと品質インデックス（検索広告）</title>
<desc id="L04-d">検索広告の掲載順位は、入札価格・広告の品質・検索の文脈・広告表示アセットの効果から、オークションのたびに計算するオークションランクの高い順。コンバージョン率は入らない。広告の品質は品質インデックス（10 段階、キーワードごと、参考値）で見る。要素は広告の関連性・LP の利便性・推定クリック値で、それぞれ 3 段階で評価される。完全一致を前提に計算し、マッチタイプ・対象外キーワード・デバイス・場所・時間帯・アセットは入らない。新しいキーワードの表示はヘルプ同士で食い違う。</desc>
