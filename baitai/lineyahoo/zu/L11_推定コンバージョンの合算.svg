<rect x="24.0" y="449.0" width="10.0" height="10.0" fill="#19E76E"/><text x="42.0" y="458.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">検索の 2025-10-22 の前と後を比べるときは、合算の始まりをまたいでいる</text>
