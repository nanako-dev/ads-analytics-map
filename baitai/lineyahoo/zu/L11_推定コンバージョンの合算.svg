<rect x="560.0" y="80.0" width="276.0" height="58.0" fill="#C9F7DC" stroke="#000000" stroke-width="1" stroke-dasharray="6 3"/>
<text x="576.0" y="116.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">＋ 推定した分</text>
<text x="24.0" y="164.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">幅は模式（割合ではない）</text>
