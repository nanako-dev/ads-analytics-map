<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 502" role="img" aria-labelledby="L11-t L11-d">
<title id="L11-t">推定コンバージョンの合算（LINEヤフー）</title>
<desc id="L11-d">管理画面とレポートに出るコンバージョン数は、測定できた分に推定した分（推定コンバージョン）を足したもので、推定だけを抜き出すことも除外することもできない。棒の幅は模式で割合ではない。合算は検索が 2025-10-22 から、ディスプレイが 2023-02-27 から。対象は、検索がウェブページの成果だけでアプリは対象外、ディスプレイがクリック経由の成果だけで動画視聴経由とアプリは対象外。</desc>
<defs><marker id="ah-L11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="502.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="46.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">管理画面・レポートに出る「コンバージョン数」</text>
