<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 586" role="img" aria-labelledby="L10-t L10-d">
<title id="L10-t">検索とディスプレイで別のもの・共通のもの（LINEヤフー）</title>
<desc id="L10-d">検索広告とディスプレイ広告は、広告アカウント、自動タグ設定、コンバージョン測定タグ、コンバージョン API を別々に持つ。検索の CV API は yclid で照合し、ディスプレイの計測タグ用の CV API とは別の機能。計測タグはディスプレイの本線で、通常の検索広告は 2026-11 時点で未対応。土台のサイトジェネラルタグ（＋補完機能タグ）だけは共通で、全ページに 1 ページ 1 つ置けば両方で動く。</desc>
<defs><marker id="ah-L10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="586.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="24.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">上の 2 本は別々に持つもの、下の土台は共通のもの</text>
<rect x="24.0" y="38.0" width="398.0" height="38.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="63.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">検索広告</text>
<rect x="438.0" y="38.0" width="398.0" height="38.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="452.0" y="63.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">ディスプレイ広告</text>
<rect x="36.0" y="88.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="48.0" y="114.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告アカウント</text>
<text x="48.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索だけのアカウント</text>
<rect x="450.0" y="88.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="114.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告アカウント</text>
<text x="462.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ディスプレイだけのアカウント</text>
<rect x="36.0" y="156.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="48.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">自動タグ設定</text>
<text x="48.0" y="204.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索のアカウントで「設定する」</text>
<rect x="450.0" y="156.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">自動タグ設定</text>
<text x="462.0" y="204.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ディスプレイのアカウントで「設定する」</text>
<rect x="36.0" y="224.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="48.0" y="250.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">コンバージョン測定タグ</text>
<text x="48.0" y="272.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索用を成果のページに</text>
<rect x="450.0" y="224.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="250.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">コンバージョン測定タグ</text>
<text x="462.0" y="272.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ディスプレイ用を成果のページに</text>
<rect x="36.0" y="292.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="48.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">コンバージョン API</text>
<text x="48.0" y="340.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">検索広告の CV API（yclid で照合）</text>
<rect x="450.0" y="292.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">コンバージョン API</text>
<text x="462.0" y="340.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">計測タグ用の CV API（別の機能）</text>
<rect x="36.0" y="360.0" width="374.0" height="58.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="48.0" y="386.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">計測タグ</text>
<text x="48.0" y="408.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">通常の検索広告は未対応（2026-11 時点）</text>
<rect x="450.0" y="360.0" width="374.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="386.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">計測タグ</text>
<text x="462.0" y="408.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ディスプレイの本線（旧タグも使える）</text>
<rect x="24.0" y="76.0" width="398.0" height="354.0" fill="none" stroke="#000000" stroke-width="1"/>
<rect x="438.0" y="76.0" width="398.0" height="354.0" fill="none" stroke="#000000" stroke-width="1"/>
<rect x="24.0" y="430.0" width="812.0" height="72.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="459.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">共通: サイトジェネラルタグ（＋補完機能タグ）</text>
<text x="38.0" y="484.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">全ページに 1 ページ 1 つ置けば、検索とディスプレイの両方で動く</text>
<rect x="24.0" y="533.0" width="10.0" height="10.0" fill="#19E76E"/><text x="42.0" y="542.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">媒体全体の CPA・ROAS は、2 つのアカウントのレポートを足して作る</text>
<text x="24.0" y="572.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-アカウント-001 ／ LY-計測-034・037 ／ LY-計測-013・014</text>
</svg>
