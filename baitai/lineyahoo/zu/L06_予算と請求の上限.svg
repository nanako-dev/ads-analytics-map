<text x="791.0" y="347.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="end">30 万円</text>
<text x="24.0" y="389.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">ディスプレイ 28 日の月</text>
<rect x="230.0" y="368.0" width="532.9" height="32.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="752.9" y="389.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="end">28 万円</text>
<line x1="230.0" y1="410.0" x2="230.0" y2="416.0" stroke="#909A8B" stroke-width="1"/>
<text x="230.0" y="430.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">0万</text>
<line x1="420.3" y1="410.0" x2="420.3" y2="416.0" stroke="#909A8B" stroke-width="1"/>
<text x="420.3" y="430.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">10万</text>
<line x1="610.6" y1="410.0" x2="610.6" y2="416.0" stroke="#909A8B" stroke-width="1"/>
<text x="610.6" y="430.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">20万</text>
<line x1="801.0" y1="410.0" x2="801.0" y2="416.0" stroke="#909A8B" stroke-width="1"/>
<text x="801.0" y="430.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">30万</text>
<line x1="808.6" y1="236.0" x2="808.6" y2="404.0" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="24.0" y="455.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="464.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Google と違う: ディスプレイは「その月の日数」で数える（検索と Google は × 30.4）</text>
<line x1="24.0" y1="490.0" x2="836.0" y2="490.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="516.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#4D4D4D" text-anchor="start">月の途中で変えたとき（例: 31 日の月の 16 日に 2 万円へ）</text>
<text x="24.0" y="549.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">1 か月の上限</text>
<rect x="230.0" y="528.0" width="188.3" height="32.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="240.0" y="549.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">使った 15 万円</text>
<rect x="418.3" y="528.0" width="401.7" height="32.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="428.3" y="549.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">2 万円 × 残り 16 日</text>
<text x="820.0" y="584.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="end">＝ 47 万円</text>
<text x="24.0" y="610.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-予算-001・003・012 ／ 02 §8 ／ ヘルプ H000044428</text>
