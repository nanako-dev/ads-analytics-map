<rect x="38.0" y="360.0" width="88.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="47.0" y="380.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">検索の成果</text>
