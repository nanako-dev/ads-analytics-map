<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 572" role="img" aria-labelledby="L19-t L19-d">
<title id="L19-t">LINEヤフー広告を 3 つの芯で見る（2026-11-18 時点）</title>
<desc id="L19-d">LINEヤフー広告の全体の地図。芯 1: 検索広告は引き金が検索クエリーと登録キーワードで、Google にかなり近い。読み替えるのは、キャンペーンが 1 アカウント 100 個まで、フレーズ一致は語順を問わない（除外は問う）、品質インデックスは完全一致が前提、など。芯 2: ディスプレイ広告は引き金が人・面・文脈で、Meta に近い面がある。入札戦略と日予算はキャンペーンに 1 つ、同じ種類のターゲティングは OR、スマートターゲティングでリストの外にも出る。芯 3: 検索とディスプレイはアカウントも計測も別系統で、検索の成果をディスプレイの入札に使う仕組み（逆も）は公式に記載が無い。共通なのはサイトジェネラルタグ（＋補完機能タグ）だけで、1 ページに 1 つで両方に効く。</desc>
<defs><marker id="ah-L19" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
