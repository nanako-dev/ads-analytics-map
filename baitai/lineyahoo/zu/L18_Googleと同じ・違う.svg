<text x="24.0" y="338.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 36 §2-1 ／ 36 §0 ／ 運用の型 型08</text>
