<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 352" role="img" aria-labelledby="L18-t L18-d">
<title id="L18-t">運用の型の規則 175 個の当てはめ: 検索とディスプレイ（LINEヤフー）</title>
<desc id="L18-d">Google 用に書いた運用の型の規則 175 個を LINEヤフーに当てはめた〔当てはめ〕。検索はそのまま使える 85、言い換えが要る 80、使えない 10。ディスプレイはそのまま 55、言い換え 89、使えない 31。検索で使えないのは P-MAX・AI Max の文面生成やアトリビューション モデルなどに依る規則、ディスプレイで使えないのは検索語句・キーワード・品質インデックスに依る規則が中心。名前の置き換えだけで済むものは「そのまま」に数えていて、Meta の当てはめ（言い換えに数えた）とは数え方が違う。</desc>
<defs><marker id="ah-L18" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="352.0" fill="#FFFFFF"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">運用の型の規則 175 個（Google 用）を LINEヤフーに当てはめると</text>
<text x="836.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#676E64" text-anchor="end">〔当てはめ〕</text>
