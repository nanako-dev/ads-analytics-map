<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">年齢制限: 商品ごとに、出ない年齢がある</text>
<rect x="24.0" y="46.0" width="16.0" height="16.0" fill="#FFD6D6" stroke="#909A8B" stroke-width="1"/>
