<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 494" role="img" aria-labelledby="L28-t L28-d">
<title id="L28-t">年齢制限: 商品ごとに、出ない年齢がある（LINEヤフー）</title>
<desc id="L28-d">ディスプレイ広告では、アルコール飲料と加熱式たばこ・電子たばこは 20 歳未満に、パチンコ・スロット・マージャン店など、出会い系サイト・結婚紹介業、性的要素を連想させるクリエイティブは 18 歳未満に出ない。年齢ターゲティングに関係なく、制限年齢には出ない。検索広告で同じ自動の制御があるかは記載が無い。検索で年齢制限のある商品を出すなら、広告文と LP の年齢確認を自分で点検する〔推測〕。</desc>
<defs><marker id="ah-L28" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
