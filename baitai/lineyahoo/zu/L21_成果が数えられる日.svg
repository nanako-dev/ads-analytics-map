<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 426" role="img" aria-labelledby="L21-t L21-d">
<title id="L21-t">成果はどの日に数えられるか（LINEヤフー）</title>
<desc id="L21-d">日付はすべて例。クリック経由の成果（検索。ディスプレイのクリック経由も同じ）は、成果が起きた日ではなく、きっかけのクリックの日に計上され、複数のクリックがあれば最後のクリックの日になる。例では 11/1 と 11/3 にクリック、11/6 に成果で、計上は 11/3。そのため 11/4 に見た 11/3 の行は 0 件でも、11/7 に見ると 1 件になり、直近の日は後から増える。ディスプレイのビュースルーは計測期間が表示から 24 時間で固定、表示の日に計上され、「コンバージョン数」とコンバージョン率には入らない。24 時間を過ぎた成果は数えない。Google と並べる前に、計上日・推定コンバージョン・計測期間（1〜90 日）の 3 つをそろえる。</desc>
<defs><marker id="ah-L21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="426.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">成果はどの日に数えられるか</text>
<text x="24.0" y="52.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">例: ある 1 人の 11 月の動き（日付はすべて例）</text>
<text x="210.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/1</text>
<text x="262.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/2</text>
<text x="314.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/3</text>
<text x="366.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/4</text>
<text x="418.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/5</text>
<text x="470.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/6</text>
<text x="522.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/7</text>
<text x="574.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/8</text>
<text x="626.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/9</text>
<text x="678.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/10</text>
<text x="730.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/11</text>
<text x="782.0" y="78.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="middle">11/12</text>
<text x="24.0" y="126.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">クリック経由</text>
<text x="24.0" y="146.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">検索（ディスプレイも同じ）</text>
<rect x="292.0" y="96.0" width="44.0" height="132.0" fill="#C9F7DC"/>
<line x1="190.0" y1="136.0" x2="802.0" y2="136.0" stroke="#909A8B" stroke-width="1"/>
<rect x="203.0" y="129.0" width="14.0" height="14.0" fill="#000000"/>
<text x="210.0" y="120.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">クリック</text>
<rect x="307.0" y="129.0" width="14.0" height="14.0" fill="#000000"/>
<text x="314.0" y="120.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">クリック</text>
<rect x="463.0" y="129.0" width="14.0" height="14.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="470.0" y="120.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">成果</text>
<polyline points="470.0,144.0 470.0,168.0 324.0,168.0 324.0,148.0" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#ah-L21)"/>
<text x="484.0" y="173.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">計上は最後のクリックの日（11/3）</text>
<text x="202.0" y="208.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">11/3 の行は、11/4 に見ると 0 件、11/7 に見ると 1 件（直近の日は後から増える）</text>
<line x1="24.0" y1="240.0" x2="836.0" y2="240.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="276.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">ビュースルー</text>
<text x="24.0" y="296.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">ディスプレイだけ</text>
<rect x="552.0" y="246.0" width="44.0" height="96.0" fill="#C9F7DC"/>
<line x1="190.0" y1="286.0" x2="802.0" y2="286.0" stroke="#909A8B" stroke-width="1"/>
<rect x="567.0" y="279.0" width="14.0" height="14.0" fill="#4D4D4D"/>
<text x="574.0" y="270.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">表示</text>
<polyline points="574.0,302.0 626.0,302.0" fill="none" stroke="#000000" stroke-width="1"/>
<line x1="574.0" y1="296.0" x2="574.0" y2="308.0" stroke="#000000" stroke-width="1"/>
<line x1="626.0" y1="296.0" x2="626.0" y2="308.0" stroke="#000000" stroke-width="1"/>
<text x="600.0" y="324.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="middle">24 時間（固定）</text>
<rect x="603.0" y="279.0" width="14.0" height="14.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="610.0" y="270.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">成果</text>
<rect x="723.0" y="279.0" width="14.0" height="14.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="730.0" y="270.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#676E64" text-anchor="middle">成果</text>
<text x="730.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#676E64" text-anchor="middle">数えない</text>
<text x="210.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">成果が 24 時間内なら表示の日に計上</text>
<text x="210.0" y="338.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">「コンバージョン数」・CV 率には入らない</text>
<rect x="24.0" y="373.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="382.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Google と並べる前に、計上日・推定コンバージョン・計測期間（1〜90 日）の 3 つをそろえる</text>
<text x="24.0" y="412.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-計測-005・026・027 ／ 90 §8-2 ／ 36 §6-1</text>
</svg>
