<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 472" role="img" aria-labelledby="L13-t L13-d">
<title id="L13-t">ディスプレイ広告の配信面と絞り方（LINEヤフー、2026-11-18 時点）</title>
<desc id="L13-d">ディスプレイ広告は、何も指定しないと、LINE（LINE アプリ・ファミリーアプリ）、Yahoo! JAPAN（トップページ・ニュースなど）、提携パートナー（LINEヤフー広告ネットワーク）、Agent i の回答結果エリア（2026-07-23 からテスト配信）の全部に出る。絞る手段はプレイスメント（URL のリスト）で、LINE アプリは ad.line.me、ファミリーアプリは familyapp.line.me、Yahoo! JAPAN は URL で指定、LINEヤフー広告ネットワークは一括で指定できず配信先 URL で 1 件ずつ、Agent i は search.yahoo.co.jp/chat を除外すると止まる。</desc>
