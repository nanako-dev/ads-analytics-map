<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 548" role="img" aria-labelledby="L14-t L14-d">
<title id="L14-t">オーディエンスリストの種類と組み合わせ（LINEヤフー ディスプレイ）</title>
<desc id="L14-d">オーディエンスリストには、広告アクションユーザー、ウェブサイト訪問ユーザー、アプリユーザー、顧客データ、高度なセグメント、LINE 公式アカウントの友だち、類似ユーザー、共通オーディエンス（興味関心など）、ビジネスマネージャー、Yahoo! Audience Discovery、組み合わせがある。サーチキーワードターゲティングは 2025-08 に終わり、後継は高度なセグメント。種類がちがっても同じオーディエンスリストなので、自社のリストと共通オーディエンスを 2 本付けるとどちらかに入れば出る OR になる。両方に入る人だけにしたいなら組み合わせリストを作る。リストと地域のように違う種類のターゲティングは AND。</desc>
<defs><marker id="ah-L14" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="548.0" fill="#FFFFFF"/>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">種類はちがっても、どれも同じ「オーディエンスリスト」</text>
<rect x="24.0" y="44.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">広告アクションユーザー</text>
<rect x="298.0" y="44.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="310.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">ウェブサイト訪問ユーザー</text>
<rect x="572.0" y="44.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="584.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">アプリユーザー</text>
<rect x="24.0" y="88.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="112.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">顧客データ</text>
<rect x="298.0" y="88.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="310.0" y="112.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">高度なセグメント</text>
<rect x="572.0" y="88.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="584.0" y="112.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">LINE 公式アカウントの友だち</text>
<rect x="24.0" y="132.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="156.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">類似ユーザー</text>
<rect x="298.0" y="132.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="310.0" y="156.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">共通オーディエンス（興味関心など）</text>
<rect x="572.0" y="132.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="584.0" y="156.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">ビジネスマネージャー</text>
<rect x="24.0" y="176.0" width="264.0" height="36.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Yahoo! Audience Discovery</text>
<rect x="298.0" y="176.0" width="264.0" height="36.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
