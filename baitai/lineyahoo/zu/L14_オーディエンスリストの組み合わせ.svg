<rect x="394.7" y="344.0" width="68.0" height="42.0" fill="#C9F7DC"/>
<rect x="312.7" y="310.0" width="150.0" height="76.0" fill="none" stroke="#000000" stroke-width="1"/>
<rect x="394.7" y="344.0" width="150.0" height="76.0" fill="none" stroke="#000000" stroke-width="1"/>
<text x="320.7" y="330.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">リスト A</text>
<text x="536.7" y="410.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">リスト B</text>
<rect x="308.7" y="426.0" width="242.7" height="28.0" fill="#F5F8F4"/>
<text x="318.7" y="445.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">AND: 両方に入る人だけ</text>
<rect x="573.3" y="268.0" width="262.7" height="196.0" fill="none" stroke="#D9D9D9" stroke-width="1"/>
<text x="587.3" y="294.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">リスト × 地域</text>
