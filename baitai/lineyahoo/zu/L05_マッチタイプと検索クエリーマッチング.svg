<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" role="img" aria-labelledby="L05-t L05-d">
<title id="L05-t">マッチタイプと検索クエリーマッチングの広がり</title>
<desc id="L05-d">内側から完全一致、フレーズ一致、インテントマッチ、検索クエリーマッチングの順に当たる検索が広がる。完全一致は一致と類似パターン。フレーズ一致は語順を問わないが、意味が変わる語順には出ない。インテントマッチは旧 部分一致で、類義語や関連する検索にも出る。いちばん外の検索クエリーマッチング（2026-09-14 開始）は自分でオンにする機能で、標準キャンペーンだけ。入稿キーワードが無くても出ることがある。</desc>
<defs><marker id="ah-L05" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="460.0" fill="#FFFFFF"/>
<rect x="24.0" y="24.0" width="812.0" height="324.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="38.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">検索クエリーマッチング</text>
<text x="38.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">キーワードが無くても出る</text>
<rect x="632.0" y="34.0" width="190.0" height="24.0" fill="#19E76E"/>
<text x="727.0" y="51.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">自分でオン・「標準」だけ</text>
<rect x="54.0" y="88.0" width="752.0" height="242.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="68.0" y="114.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">インテントマッチ</text>
<text x="68.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">類義語・関連する検索（旧 部分一致）</text>
<rect x="84.0" y="152.0" width="692.0" height="160.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="98.0" y="178.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">フレーズ一致</text>
<text x="98.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">語順を問わない（意味が変わる語順は除く）</text>
<rect x="114.0" y="216.0" width="632.0" height="78.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="128.0" y="242.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">完全一致</text>
<text x="128.0" y="264.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">一致＋類似パターン</text>
<text x="24.0" y="384.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">外側ほど表示の機会が多い</text>
<rect x="24.0" y="407.0" width="10.0" height="10.0" fill="#19E76E"/><text x="42.0" y="416.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">どれで当たったかは、検索クエリーレポートのマッチタイプ列で分かる</text>
<text x="24.0" y="446.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-キーワード-004・009・010 ／ 00 §5 ／ ヘルプ H000064675</text>
</svg>
