<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 506" role="img" aria-labelledby="L24-t L24-d">
<title id="L24-t">入札価格調整率は、どの入札戦略で効くか（LINEヤフー）</title>
<desc id="L24-d">検索の自動入札では、クリック数の最大化だけがデバイス・地域・曜日時間帯・オーディエンスリストの調整率がすべて効く。コンバージョン単価の目標値はデバイスだけが効き、入札価格ではなく目標値に掛かる。コンバージョン数の最大化・コンバージョン価値の最大化・広告費用対効果の目標値・ページ最上部掲載は、デバイスの −100%（そのデバイスに出さない）だけが効き、ほかは効かない。ディスプレイは広告グループに設定した全ターゲティングに調整率を付けられるが、自動入札（拡張クリック単価を含む）では一切効かない。効くのは個別クリック単価などの手動系で、範囲は引き上げ 1〜100%、引き下げ −1〜−90%（手動系だけというのは除外の一覧の裏返しで〔推測〕）。</desc>
