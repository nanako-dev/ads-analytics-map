<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 710" role="img" aria-labelledby="L30-t L30-d">
<title id="L30-t">立ち上げの時間割（LINEヤフー、〔当てはめ〕）</title>
<desc id="L30-d">縦の軸は日数に比例し、42 日より後は省略している（W 14 日・L 7 日のとき、〔当てはめ〕）。開始の 5〜3 営業日前に入稿とタグのテスト（審査は 3 営業日前後、ディスプレイの画像・動画は広告に設定した日から）。0 日に、検索は CV 数の最大化（目標値なし）、ディスプレイは目標値なしか拡張クリック単価で開始。1〜7 日は事故だけ見て、検索ではキーワードを足さない。7 日でディスプレイの学習中が続けば公式の見直し項目を点検。14 日に中間点検。21 日（W ＋ L）から初めて達否を見て、確定で検索 30 件なら目標値を付け、ディスプレイ 40 件なら目標値ありへ。目標値を付けてから W の後に、検索は規換-08 の刻み、ディスプレイは 2 週間見て ±20%。2 か月以上で増額や検索クエリーマッチングの検討、ディスプレイは面とリストの整理。</desc>
