<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" role="img" aria-labelledby="L08-t L08-d">
<title id="L08-t">承認済みの広告を編集したとき（LINEヤフー）</title>
<desc id="L08-d">LINEヤフーでは、承認済みの広告・キーワード・広告表示アセットを編集すると「編集内容審査中」になり、その間も編集前の内容 A で配信が続く。承認されれば編集後の内容 B に上書きされ、否認されても A のまま配信が続く。ディスプレイの画像・動画は編集できない。Google 側で編集中に何が配信されるかは知識ベースに記載がないので描いていない。</desc>
<defs><marker id="ah-L08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="370.0" fill="#FFFFFF"/>
<text x="210.0" y="36.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">承認済み</text>
<line x1="200.0" y1="20.0" x2="200.0" y2="236.0" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="390.0" y="36.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">編集内容審査中</text>
<line x1="380.0" y1="20.0" x2="380.0" y2="236.0" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4 4"/>
<text x="590.0" y="36.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">審査の結果</text>
<line x1="580.0" y1="20.0" x2="580.0" y2="236.0" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="836.0" y1="20.0" x2="836.0" y2="236.0" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="380.0" y1="48.0" x2="380.0" y2="62.0" stroke="#000000" stroke-width="1" marker-end="url(#ah-L08)"/>
<text x="372.0" y="58.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">編集</text>
<text x="24.0" y="94.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">配信される内容</text>
<rect x="200.0" y="70.0" width="380.0" height="40.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="212.0" y="96.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">編集前の A</text>
<text x="392.0" y="96.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">審査中も A のまま</text>
<polyline points="580.0,90.0 594.0,90.0 594.0,166.0 606.0,166.0" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#ah-L08)"/>
<polyline points="594.0,166.0 594.0,226.0 606.0,226.0" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#ah-L08)"/>
<rect x="608.0" y="146.0" width="228.0" height="40.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="620.0" y="172.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">承認 → B に上書き</text>
<rect x="608.0" y="206.0" width="228.0" height="40.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="620.0" y="232.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">否認 → A のまま</text>
<rect x="24.0" y="283.0" width="10.0" height="10.0" fill="#19E76E"/><text x="42.0" y="292.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">否認されても配信は止まらない（ディスプレイの画像・動画は編集できない）</text>
<text x="42.0" y="326.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#B42318" text-anchor="start">Google 側で編集中に何が出るか: 知識ベースに記載なし</text>
<text x="24.0" y="356.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-ポリシー-019・020 ／ 34 §0-1 ／ ヘルプ H000045072</text>
</svg>
