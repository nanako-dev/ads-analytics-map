<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 735" role="img" aria-labelledby="L02-t L02-d">
<title id="L02-t">LINE 広告との統合の年表（2026-11-18 時点）</title>
<desc id="L02-d">2025-09-25 に統合を発表。2026-04-01 に統合と掲載基準の統一。2026-06-30 に LINE 広告の新規アカウント作成を終了。2026-10-26 に LINE 広告の日本向け配信を停止し、管理画面は読み取り専用に。2027-01-13 にディスプレイの一部レポートが終わる予定。2027 年 3 月末頃に LINE 広告が完全に終わる予定。縦の軸は日付に比例する。</desc>
