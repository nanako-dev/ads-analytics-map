<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 424" role="img" aria-labelledby="L01-t L01-d">
<title id="L01-t">LINEヤフー広告のサービスの地図（2026-11-18 時点）</title>
<desc id="L01-d">2026-04-01 に Yahoo!広告は LINEヤフー広告に。検索広告は名前が変わっただけで統合の外。LINE 広告と Yahoo!広告 ディスプレイ広告は LINEヤフー広告 ディスプレイ広告（運用型・予約型）に統合され、仕様は旧 YDA と同じ。検索広告（ショッピング）も別。3 つのアカウントは別々で、同じ広告管理ツールの中で切り替える。</desc>
<defs><marker id="ah-L01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
