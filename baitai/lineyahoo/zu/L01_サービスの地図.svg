<text x="250.0" y="329.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">同じ「広告管理ツール」の中で切り替える</text>
<rect x="24.0" y="371.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="380.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">Google と違う: Google は 1 つのアカウントで検索もディスプレイも</text>
