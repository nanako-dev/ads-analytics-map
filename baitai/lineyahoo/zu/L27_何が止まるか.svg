<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 474" role="img" aria-labelledby="L27-t L27-d">
<title id="L27-t">何が止まるか: 広告 1 本・商品・アカウント（LINEヤフー）</title>
<desc id="L27-d">入れ子の外から、アカウントの停止、商品・サービス単位の締め出し、広告 1 本の否認。アカウントは、第 4 章の商材、不正な表現や手法（サイトチェンジなど）、違反の大量・繰り返しで停止されうるが、何回で止まるかは記載が無い。商品は、景品表示法の行政処分を受けると処分以降は掲載不可で、是正が確認できれば再開できる。重大な違反の実績がある商品は、表現を直しても以降は掲載できない。広告 1 本の否認は、直して保存すると再審査に回る。別の軸として掲載制限があり、面ごとに出さないカテゴリーを決める仕組みで、否認ではなくその面に出ないだけ。広告を直しても変わらない。図の面の例は例。</desc>
<defs><marker id="ah-L27" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="474.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">何が止まるか: 広告 1 本・商品・アカウント</text>
<rect x="24.0" y="50.0" width="560.0" height="340.0" fill="#FFD6D6" stroke="#000000" stroke-width="1.5"/>
<text x="38.0" y="76.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">アカウントの停止</text>
<text x="38.0" y="98.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">第 4 章の商材・不正な表現や手法（サイトチェンジ等）</text>
<text x="38.0" y="118.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">違反の大量・繰り返し</text>
<text x="180.0" y="118.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#B42318" text-anchor="start">何回で止まるかは記載なし</text>
<rect x="44.0" y="136.0" width="520.0" height="236.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="58.0" y="162.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">商品・サービス単位の締め出し</text>
<rect x="58.0" y="176.0" width="239.0" height="84.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="70.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">景表法の行政処分</text>
<text x="70.0" y="222.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">処分以降は掲載不可</text>
<text x="70.0" y="242.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">是正が確認できれば再開</text>
<rect x="311.0" y="176.0" width="239.0" height="84.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="323.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">重大な違反の実績</text>
<text x="323.0" y="222.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">表現を直しても</text>
<text x="323.0" y="242.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">以降は掲載不可</text>
<rect x="58.0" y="276.0" width="492.0" height="82.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="72.0" y="304.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告 1 本の否認</text>
<text x="72.0" y="328.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">直して保存すると、再審査に回る</text>
<text x="604.0" y="64.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">別の軸: 掲載制限（面の側）</text>
<rect x="604.0" y="80.0" width="232.0" height="40.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="616.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">LINE の面</text>
<rect x="604.0" y="128.0" width="232.0" height="40.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="616.0" y="154.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#676E64" text-anchor="start">Yahoo! JAPAN の面</text>
<text x="826.0" y="154.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#676E64" text-anchor="end">例: 出ない</text>
<rect x="604.0" y="176.0" width="232.0" height="40.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="616.0" y="202.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">提携パートナー</text>
<text x="604.0" y="246.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">否認ではない。その面に出ないだけ</text>
<text x="604.0" y="268.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">広告を直しても変わらない</text>
<text x="604.0" y="300.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#676E64" text-anchor="start">（面ごとのカテゴリーの一覧は</text>
<text x="604.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#676E64" text-anchor="start">PDF で、読めていない）</text>
<rect x="24.0" y="421.0" width="10.0" height="10.0" fill="#FFA9FD"/><text x="42.0" y="430.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">健康食品・化粧品の新商品は最初の入稿で攻めない。重大な違反と判定されると直しても戻れない〔推測〕</text>
<text x="24.0" y="460.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 31 §3 ／ LY-ポリシー-042・043・053 ／ LY-ポリシー-010</text>
</svg>
