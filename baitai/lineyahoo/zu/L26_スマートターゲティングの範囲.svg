<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 538" role="img" aria-labelledby="L26-t L26-d">
<title id="L26-t">スマートターゲティングが広げる所・守る所（LINEヤフー ディスプレイ）</title>
<desc id="L26-d">外の枠は地域・年齢・性別・デバイス・曜日時間帯・プレイスメント・コンテンツキーワードの範囲で、スマートターゲティングもこの外には広げない。オーディエンスリストを付けた広告グループでは、リストの外の範囲を超えて CV しそうな人にも出る（点線の面）。除外リストの人には出ない。学習の後は、付けたリストに表示の実績が溜まらない。広告グループを作ったときの初期値は、目的がコンバージョン・アプリ訴求・サイト誘導なら「利用する」、それ以外は「利用しない」。</desc>
<defs><marker id="ah-L26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="538.0" fill="#FFFFFF"/>
<text x="836.0" y="22.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="30.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">スマートターゲティングが広げる所・守る所</text>
<text x="24.0" y="58.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">外の枠: 地域・年齢・性別・デバイス・曜日時間帯・プレイスメント・コンテンツキーワードの範囲</text>
<rect x="24.0" y="70.0" width="812.0" height="300.0" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
<rect x="70.0" y="106.0" width="520.0" height="236.0" fill="#C9F7DC" stroke="#0B8F45" stroke-width="1" stroke-dasharray="6 4"/>
<text x="84.0" y="132.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">スマートターゲティングで広がる所（リストを付けたとき）</text>
<text x="84.0" y="154.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">リストの外の、CV しそうな人</text>
<rect x="110.0" y="176.0" width="250.0" height="130.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="124.0" y="204.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">付けたオーディエンスリスト</text>
<text x="124.0" y="228.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">学習の後は、表示の実績が</text>
<text x="124.0" y="248.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">このリストに溜まらない</text>
<rect x="400.0" y="196.0" width="170.0" height="92.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="412.0" y="224.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">除外リスト</text>
<text x="412.0" y="248.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ここには出ない</text>
<text x="818.0" y="220.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">枠の外には</text>
<text x="818.0" y="240.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">広げない</text>
<text x="24.0" y="410.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">広告グループを作ったときの初期値（目的ごと）</text>
<rect x="24.0" y="422.0" width="184.9" height="32.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="33.0" y="443.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">コンバージョン: 利用する</text>
<rect x="220.9" y="422.0" width="156.9" height="32.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="229.9" y="443.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">アプリ訴求: 利用する</text>
<rect x="389.8" y="422.0" width="156.9" height="32.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="398.8" y="443.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">サイト誘導: 利用する</text>
<rect x="558.6" y="422.0" width="156.9" height="32.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/><text x="567.6" y="443.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">それ以外: 利用しない</text>
<rect x="24.0" y="485.0" width="10.0" height="10.0" fill="#19E76E"/><text x="42.0" y="494.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">リターゲティングの効果を測る広告グループは「利用しない」に。作るたびに初期値を確かめる</text>
<text x="24.0" y="524.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: LY-ターゲティング-021〜024 ／ 23 §7 ／ ヘルプ H000047178</text>
</svg>
