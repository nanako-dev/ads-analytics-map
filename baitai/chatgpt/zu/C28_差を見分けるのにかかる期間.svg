<svg viewBox="0 0 860 442" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c28t c28d" class="fig">
<title id="c28t">C28 差を見分けるのにかかる期間</title>
<desc id="c28d">月 5 件のアカウントを 2 群に分けて比べたとき（1 群 月 2.5 件）、差を見分けるのにかかる期間の計算（両側 5%・検出力 80%、1 群に要る成果はおよそ 15.7 ÷ 差の 2 乗）。2 倍の差なら 1 群 約 16 件で約 6 か月、50% の差なら約 63 件で約 2 年、30% の差なら約 174 件で約 6 年。運用の型の時間切れ 8 週を縦の線で示した。2026-11-18 時点。</desc>
<rect width="860" height="442" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔計算〕月 5 件を 2 群に（1 群 月 2.5 件）・両側 5%・検出力 80%</text>
<text x="24.0" y="60.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">見つけたい差</text>
