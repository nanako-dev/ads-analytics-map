<text x="540.0" y="480.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">画面の目安 54 字 ／ 文書の上限 100 字 △</text>
<line x1="488.0" y1="530.0" x2="534.0" y2="530.0" stroke="#909A8B" stroke-width="1"/>
