<svg viewBox="0 0 860 761" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c01t c01d" class="fig">
<title id="c01t">C01 広告が出る場所</title>
<desc id="c01d">チャットの画面の模式図。利用者の質問、ChatGPT の回答、その下に「スポンサー」と分けて広告カードが 1 つ出る。広告は回答に影響しない。カードはアイコンとブランド名・「広告」・タイトル・説明・画像・「詳細を見る」。タイトルは画面の目安 32 字・文書の上限 50 字、説明は目安 54 字・上限 100 字（△ 数字が違う）。全角も 1 字で、目安を超えると切れる。広告の中身は架空の例。2026-11-18 時点。</desc>
<rect width="860" height="761" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">チャットの画面（模式図。要素の並びは実際と違うことがある）</text>
<text x="40.0" y="88.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#676E64" text-anchor="start">利用者の質問</text>
<rect x="200.0" y="68.0" width="288.0" height="62.0" fill="#F5F8F4" stroke="#D9D9D9" stroke-width="1"/>
<text x="214.0" y="90.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">例: 3 泊の出張に向く、機内に持ち込める</text>
<text x="214.0" y="111.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">スーツケースの選び方は?</text>
<text x="40.0" y="164.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#676E64" text-anchor="start">ChatGPT の回答</text>
