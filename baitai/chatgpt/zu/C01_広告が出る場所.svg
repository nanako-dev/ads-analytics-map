<line x1="40.0" y1="284.0" x2="488.0" y2="284.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="40.0" y="308.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">スポンサー</text>
<rect x="56.0" y="336.0" width="32.0" height="32.0" fill="#F5F8F4" stroke="#909A8B" stroke-width="1"/>
<text x="100.0" y="350.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">ハコビ鞄店（架空）</text>
<text x="100.0" y="367.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">広告</text>
<text x="56.0" y="404.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="600" fill="#000000" text-anchor="start">機内に持ち込めて 3 泊分入る、2.1kg のスーツケース</text>
<text x="56.0" y="432.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">ポケットが 4 つで荷物を仕分けやすく、静かに転がる双輪キャス</text>
<text x="56.0" y="453.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">ター。購入から 2 年の修理つき。</text>
