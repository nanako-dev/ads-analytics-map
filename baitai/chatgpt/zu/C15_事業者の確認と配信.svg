<text x="24.0" y="374.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">配信</text>
<rect x="190.0" y="330.0" width="353.0" height="100.0" fill="#F5F8F4" stroke="#909A8B" stroke-width="1"/>
