<text x="836.0" y="458.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">時間 →</text>
<rect x="24.0" y="489.0" width="530.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="508.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">確認の前でも配信は始まるが、後で止まりうる。確認は出稿の前に済ませる</text>
<line x1="24.0" y1="528.0" x2="836.0" y2="528.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="548.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">出典: C-アカウント-006・007 ／ help 20001534 ／ 62#13〔画面〕</text>
