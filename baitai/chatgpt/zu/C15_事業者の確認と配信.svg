<line x1="190.0" y1="290.0" x2="836.0" y2="290.0" stroke="#000000" stroke-width="1"/>
<polyline points="190.0,290.0 310.0,272.0 450.0,238.0 590.0,190.0 710.0,162.0 836.0,144.0" fill="none" stroke="#000000" stroke-width="1.5"/>
<line x1="190.0" y1="207.0" x2="836.0" y2="207.0" stroke="#000000" stroke-width="1" stroke-dasharray="5 3"/>
<text x="836.0" y="227.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="end">一定額（一律ではない。金額は <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan>）</text>
<rect x="538.0" y="202.0" width="10.0" height="10.0" fill="#000000"/>
<line x1="543.0" y1="92.0" x2="543.0" y2="470.0" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="551.0" y="114.0" width="184.0" height="26.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
