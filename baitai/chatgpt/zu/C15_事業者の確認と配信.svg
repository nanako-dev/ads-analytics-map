<svg viewBox="0 0 860 564" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c15t c15d" class="fig">
<title id="c15t">C15 事業者の確認と配信</title>
<desc id="c15d">時間の流れの模式図（日数・金額の目盛りは無い）。事業者の確認は進行中が最大 7 営業日。確認の前でも配信は始まり、費用が発生しうる。累計の支出が一定額（一律ではなく、金額は記載なし）に達すると追加の確認を求められうる。その後、確認が済んでいれば配信は続き、未完了だと制限・停止されうる。2026-11-18 時点。</desc>
<rect width="860" height="564" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">時間の流れ（模式図。日数・金額の目盛りは無い）</text>
<text x="24.0" y="78.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">事業者の確認</text>
<rect x="190.0" y="56.0" width="300.0" height="36.0" fill="#FFE7B8" stroke="#909A8B" stroke-width="1"/>
<text x="200.0" y="79.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">進行中（最大 7 営業日）</text>
<rect x="490.0" y="56.0" width="346.0" height="36.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="500.0" y="79.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">済む／未完了のまま</text>
<text x="24.0" y="180.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">累計の支出</text>
<text x="24.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">（模式）</text>
