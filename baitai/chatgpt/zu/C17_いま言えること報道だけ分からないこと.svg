<svg viewBox="0 0 860 551" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c17t c17d" class="fig">
<title id="c17t">C17 いま言えること・報道だけ・分からないこと</title>
<desc id="c17d">61 の 3 つの表の件数を、1 件 1 マスで示す。公式に言えること 28 件（例: 2026-08-11 に日本で提供開始、日本円の 1 日の予算は最低 2,500 円、2026-11-09 から新規は目標 CPA／目標 CPC）。報道だけで公式に確かめられないこと 8 件（例: 日本の表示開始は 2026-06 とする報道、払う額は 2 位価格という要約で公式ヘルプの「落札の入札額」と食い違う、国内の広告会社 3 社がローンチ パートナー）。分からないこと 13 件で、うち 5 件は 2026-11-18 に解決（例: 一般提供の時期、学習期間と品質スコアに当たるもの、広告の審査にかかる時間）。2026-11-18 時点。</desc>
