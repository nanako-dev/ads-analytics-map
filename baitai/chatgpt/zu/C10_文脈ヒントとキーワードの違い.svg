<text x="261.0" y="376.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">LP</text>
<rect x="303.2" y="354.0" width="122.0" height="34.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="315.2" y="376.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">タイトル・本文</text>
<rect x="435.2" y="354.0" width="318.0" height="34.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="447.2" y="376.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">文脈ヒント（広告グループごと・最大 2,000）</text>
