<svg viewBox="0 0 860 732" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c10t c10d" class="fig">
<title id="c10t">C10 文脈ヒントとキーワードの違い</title>
<desc id="c10d">広告が出るまでの 2 つの流れの模式図。Google の検索広告は、利用者が検索した語句をキーワード（マッチタイプ、完全一致など）と照合し、一致すれば候補になる。ChatGPT の広告はキーワードが無く、会話の流れをシステムが要約して意図を読み、LP・タイトル・本文・文脈ヒントを材料に、関連性と成果の見込みで選ぶ。特定の会話での配信は保証しない。文脈ヒントは広告グループごとに最大 2,000。公式の例では「靴」より「岩場向けの軽いトレイル ランニング シューズ」が役立つ。地域の制限・配信の時間帯・除外の条件はヒントに書いても効かない。2026-11-18 時点。</desc>
<rect width="860" height="732" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">広告が出るまで（模式図）</text>
<text x="24.0" y="64.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Google の検索広告</text>
<rect x="24.0" y="80.0" width="244.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">利用者が検索した語句</text>
<text x="36.0" y="126.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">例: 機内持ち込み スーツケース</text>
<rect x="308.0" y="80.0" width="244.0" height="58.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<text x="320.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">キーワードと照合</text>
<text x="320.0" y="126.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">マッチタイプ（完全一致 など）</text>
<polyline points="268.0,109.0 302.0,109.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M308.0 109.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="592.0" y="80.0" width="244.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="604.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">一致すれば広告の候補に</text>
<polyline points="552.0,109.0 586.0,109.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M592.0 109.0 l-7 -4 v8 z" fill="#000000"/>
<line x1="24.0" y1="158.0" x2="836.0" y2="158.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="190.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">ChatGPT の広告</text>
<rect x="155.7" y="174.0" width="118.0" height="23.0" fill="#FFA9FD"/>
<text x="162.7" y="190.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">キーワードは無い</text>
<rect x="24.0" y="206.0" width="173.0" height="76.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="232.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">会話の流れ</text>
