<path d="M536.5 282.0 l-4 7 h8 z" fill="#000000"/>
<text x="24.0" y="456.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">文脈ヒントの書き方（公式の例）</text>
