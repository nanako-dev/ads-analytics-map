<text x="462.0" y="253.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">で選ぶ</text>
<polyline points="410.0,244.0 444.0,244.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M450.0 244.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="663.0" y="206.0" width="173.0" height="76.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="675.0" y="232.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">出るとは限らない</text>
<text x="675.0" y="252.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">特定の会話での配信は保証</text>
<text x="675.0" y="270.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">しない</text>
