<svg viewBox="0 0 860 738" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c05t c05d" class="fig">
<title id="c05t">C05 予算の 7 日平均</title>
<desc id="c05d">例: 1 日の予算 2,500 円（日本円の最低額）。上の棒はその日に使われた額で、1 日の上限は 2 倍の 5,000 円。下の棒は週（日曜〜土曜）の累計で、週の上限は 7 倍の 17,500 円。例では日 5,000・月 4,000・火 5,000・水 3,500 円で水曜に累計 17,500 円に届き、木〜土は「有効」のまま止まる。2026-11-18 時点。</desc>
