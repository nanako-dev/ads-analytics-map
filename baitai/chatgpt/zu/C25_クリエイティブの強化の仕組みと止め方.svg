<svg viewBox="0 0 860 738" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c25t c25d" class="fig">
<title id="c25t">C25 クリエイティブの強化の仕組みと止め方</title>
<desc id="c25d">クリエイティブの強化の流れ。材料は会話の文脈か利用者の興味、既存の広告、広告の LP の中身。変わりうるのは、見出しと説明（新しい文・書き換え）、言語（別の言語への翻訳）、画像（形式に合わせたサイズ）、リンク先 URL（サイト内の関連ページへ）。1 本ずつの確認・承認なしで配信され、すべてのプレビューは無い。2026-10-30 からセルフサーブと BPO で既定でオン、営業が管理するアカウントは対象外。止めるのはアカウントの既定（設定 &gt; 一般 &gt; クリエイティブ設定）とキャンペーンの設定で、キャンペーンが優先。翻訳だけ・リンク先だけを止める方法と、出た文面の一覧は記載なし。2026-11-18 時点。</desc>
<rect width="860" height="738" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">2026-10-30 からセルフサーブと BPO で既定でオン</text>
