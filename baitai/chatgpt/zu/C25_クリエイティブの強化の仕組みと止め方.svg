<path d="M430.0 154.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="24.0" y="154.0" width="812.0" height="176.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="38.0" y="180.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">クリエイティブの強化</text>
<rect x="38.0" y="196.0" width="386.0" height="56.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="48.0" y="220.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">見出しと説明</text>
<text x="48.0" y="240.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">新しい文を作る・書き換える</text>
<rect x="436.0" y="196.0" width="386.0" height="56.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
