<text x="24.0" y="466.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">どこで止めるか</text>
<rect x="24.0" y="482.0" width="500.0" height="150.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
