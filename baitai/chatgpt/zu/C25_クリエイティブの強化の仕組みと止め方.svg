<rect x="48.0" y="546.0" width="452.0" height="70.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="62.0" y="574.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">キャンペーンの設定</text>
<text x="62.0" y="598.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">アカウントの既定より優先する</text>
<rect x="394.0" y="558.0" width="92.0" height="23.0" fill="#C9F7DC"/>
<text x="401.0" y="574.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">こちらが優先</text>
