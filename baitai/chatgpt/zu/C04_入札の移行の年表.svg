<title id="c04t">C04 入札の移行の年表</title>
<desc id="c04d">2026-11-01 から 2027-01-20 の日付の軸。2026-11-09 から新規は目標 CPA／目標 CPC。2026-11-18 から API は新しい欄を推奨し、旧欄の値は平均の目標として扱う。2026-12-31 に旧欄の受け付けが終わり、2027-01-01 に上限入札（画面では「手動入札」）が廃止。払う額は最終的な落札の入札額（ヘルプ）で、報道の 2 位価格と食い違う（△）。2026-11-18 時点。</desc>
