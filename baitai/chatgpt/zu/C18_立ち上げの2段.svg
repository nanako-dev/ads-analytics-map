<text x="239.5" y="371.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">EQS の重い警告が無い</text>
<rect x="435.0" y="346.0" width="195.5" height="40.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="445.0" y="371.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">台帳との比が 2 週そろう</text>
<rect x="640.5" y="346.0" width="195.5" height="40.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="650.5" y="371.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">成果が月 30 件前後見込める</text>
