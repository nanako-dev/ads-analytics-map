<svg viewBox="0 0 860 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c18t c18d" class="fig">
<title id="c18t">C18 小さく試す立ち上げの 2 段〔当てはめ〕</title>
<desc id="c18d">立ち上げの時間割の模式図（日数は 36 の時間割の値で、当てはめ）。公開の 14 日前から準備（業種・事業者の確認・計測・入稿）。0 日目に段 1 のクリック目的のキャンペーンを公開（成果は計測だけ付ける）。14 日目に中間点検、21 日目に段 1 を出る条件（計測のテストが通る・EQS の重い警告が無い・台帳との比が 2 週そろう・成果が月 30 件前後見込める）を確かめる。満たせば段 2 のコンバージョン目的を新しいキャンペーンで作り、最低予算に近いなら段 1 を止める。目的・イベント・課金方法は作った後に変えられない（公式）ので、同じキャンペーンでは進めない。2026-11-18 時点。</desc>
