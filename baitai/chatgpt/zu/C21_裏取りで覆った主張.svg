<svg viewBox="0 0 860 579" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c21t c21d" class="fig">
<title id="c21t">C21 裏取りで覆った主張</title>
<desc id="c21d">初版や他の資料の言い方と、2026-11-18 に公式の本文で確かめた実際の対。#1 コンバージョン目的の課金はクリックだけ → クリック（oCPC）か 1,000 表示（oCPM）を選び、成果ごとには払わない。#2 ビュースルーは合計に入らない → 表示後の窓が 1 日なら入る。#3 除外の仕組みは無い → 資格のある一部の広告主に Negative Phrases。#4 暗号資産は選ばれた広告主なら日本でも可 → 米国外は不可。#6 法人名を変えると必ず止まる → 承認まで止まるのはブランド名、法人名は止まることがある。#8 払う額は 2 位価格 → △ ヘルプは最終的な落札の入札額とだけ書き、2 位価格は第三者の要約。番号は 90§13 の行。2026-11-18 時点。</desc>
<rect width="860" height="579" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">番号は 90§13 の行</text>
<text x="72.0" y="56.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#4D4D4D" text-anchor="start">初版・他の資料の言い方</text>
<text x="450.0" y="56.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">公式の本文で確かめた実際</text>
<text x="24.0" y="107.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#1</text>
<rect x="72.0" y="72.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="105.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">コンバージョン目的なら、課金はクリックだけ</text>
<polyline points="408.0,102.0 438.0,102.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 102.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="72.0" width="386.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="95.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">クリック（oCPC）か 1,000 表示（oCPM）を選ぶ。成果</text>
<text x="462.0" y="116.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">ごとには払わない</text>
<text x="24.0" y="179.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#2</text>
<rect x="72.0" y="144.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="177.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">ビュースルーは「コンバージョン」に入らない</text>
<polyline points="408.0,174.0 438.0,174.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 174.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="144.0" width="386.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="167.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">表示後の窓が 1 日なら合計に入る。窓はレポートだけに</text>
<text x="462.0" y="188.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">効く</text>
<text x="24.0" y="240.5" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#3</text>
<rect x="72.0" y="216.0" width="330.0" height="39.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="239.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">除外キーワードに当たる仕組みは一切無い</text>
<polyline points="408.0,235.5 438.0,235.5" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 235.5 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="216.0" width="386.0" height="39.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="239.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">資格のある一部の広告主だけ Negative Phrases がある</text>
<text x="24.0" y="302.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#4</text>
<rect x="72.0" y="267.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="290.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">暗号資産は、選ばれた広告主なら日本でも出せ</text>
<text x="84.0" y="311.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">る</text>
<polyline points="408.0,297.0 438.0,297.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 297.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="267.0" width="386.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="300.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">米国外は不可。「選ばれた広告主」は米国の扱い</text>
<text x="24.0" y="374.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#6</text>
<rect x="72.0" y="339.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="372.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">法人名を変えると必ず配信が止まる</text>
<polyline points="408.0,369.0 438.0,369.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 369.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="339.0" width="386.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="362.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">承認まで止まるのはブランド名。法人名は「止まること</text>
<text x="462.0" y="383.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">がある」</text>
<text x="24.0" y="446.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="500" fill="#676E64" text-anchor="start">#8</text>
<rect x="72.0" y="411.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="84.0" y="444.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">払う額は「2 位価格」と公式が説明している</text>
<polyline points="408.0,441.0 438.0,441.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M444.0 441.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="450.0" y="411.0" width="386.0" height="60.0" fill="#FFE7B8" stroke="#000000" stroke-width="1.25"/>
<text x="462.0" y="434.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">△ ヘルプは「最終的な落札の入札額が払う額を決める」</text>
<text x="462.0" y="455.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">とだけ。2 位価格は第三者の要約</text>
<rect x="24.0" y="504.0" width="492.5" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="523.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">食い違ったら、94 の本文の点検を正とする（各章の古い記述より先）</text>
<line x1="24.0" y1="543.0" x2="836.0" y2="543.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="563.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">出典: 90§13 ／ 94#7・#17・#19・#23 </text>
</svg>
