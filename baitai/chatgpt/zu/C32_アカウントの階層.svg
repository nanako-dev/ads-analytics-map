<svg viewBox="0 0 860 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c32t c32d" class="fig">
<title id="c32t">C32 アカウントの階層</title>
<desc id="c32d">広告アカウント、キャンペーン、広告グループ、広告の 4 段を入れ子の枠で示した。広告アカウントはブランド名・アイコン・権限・費用の上限を決め、国・通貨・タイムゾーンは作成後に変えられない。キャンペーンは予算（1 日か通期）・期間・地域・端末・オーディエンスを決め、目的・最適化のイベント・課金方法は作成後に変えられない。広告グループは入札戦略・文脈ヒント（最大 2,000）・オーディエンス別の倍率・商品セット。広告はクリエイティブ・画像か商品テンプレート・リンク先で、別の広告グループに移せない。キャンペーン・広告グループ・広告はアカウントあたり各 5,000 まで（広告グループの数はヘルプの間で書き方が違う、△）。複数のアカウントを束ねる上位（MCC に当たるもの）は記載なし。2026-11-18 時点。</desc>
<rect width="860" height="560" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">外の枠ほど上の階層（入れ子の模式図）</text>
<rect x="24.0" y="50.0" width="812.0" height="44.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36.0" y="74.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">複数のアカウントを束ねる上位（MCC に当たるもの）: <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan>。広告主ごとに別アカウント</text>
<rect x="24.0" y="116.0" width="812.0" height="338.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="38.0" y="143.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" text-anchor="start"><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700" fill="#000000" font-size="15">広告アカウント</tspan></text>
<text x="38.0" y="168.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ブランド名・アイコン・権限・費用の上限</text>
<rect x="596.8" y="128.0" width="225.2" height="22.0" fill="#FFE7B8"/>
<text x="603.8" y="143.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="start">変えられない: 国・通貨・タイムゾーン</text>
<rect x="50.0" y="190.0" width="760.0" height="250.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="64.0" y="217.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" text-anchor="start"><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700" fill="#000000" font-size="15">キャンペーン</tspan><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="400" fill="#676E64" font-size="12">  各 5,000／アカウント</tspan></text>
<text x="64.0" y="242.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">予算（1 日か通期）・期間・地域・端末・オーディエンス</text>
<rect x="582.8" y="202.0" width="213.2" height="22.0" fill="#FFE7B8"/>
<text x="589.8" y="217.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="start">変えられない: 目的・イベント・課金</text>
<rect x="76.0" y="264.0" width="708.0" height="162.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="90.0" y="291.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" text-anchor="start"><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700" fill="#000000" font-size="15">広告グループ</tspan><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="400" fill="#676E64" font-size="12">  各 5,000／アカウント（△）</tspan></text>
<text x="90.0" y="316.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">入札戦略・文脈ヒント（最大 2,000）・オーディエンス別の倍率・商品セット</text>
<rect x="102.0" y="338.0" width="656.0" height="74.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="116.0" y="365.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" text-anchor="start"><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700" fill="#000000" font-size="15">広告</tspan><tspan font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="400" fill="#676E64" font-size="12">  各 5,000／アカウント</tspan></text>
<text x="116.0" y="390.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">クリエイティブ・画像か商品テンプレート・リンク先</text>
<rect x="574.0" y="350.0" width="170.0" height="22.0" fill="#FFE7B8"/>
<text x="581.0" y="365.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="start">別の広告グループに移せない</text>
<rect x="24.0" y="485.0" width="428.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="504.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">変えられない欄は外側の 2 段にある。最初に決めてから作る</text>
<line x1="24.0" y1="524.0" x2="836.0" y2="524.0" stroke="#D9D9D9" stroke-width="1"/>
