<svg viewBox="0 0 860 524" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c13t c13d" class="fig">
<title id="c13t">C13 審査の 3 層</title>
<desc id="c13d">審査の 3 層を上から順に通る流れ。① 広告主（正当な事業者か・資格・詐欺のリスク。事業者の確認は最大 7 営業日）で落ちると、事業者の確認の失敗や業種が対象外。② クリエイティブと LP（タイトル・本文・画像・LP のどれか 1 つでも反すれば却下）で落ちると広告の不承認で、OAI-AdsBot が LP を読めないときも配信されない。③ 掲載（承認された広告を合う会話にだけ出す）は不承認にはならず、敏感な会話には出ない。3 層を通ると配信され、承認の後も監視は続く。審査はほとんど自動で、一部は人。2026-11-18 時点。</desc>
<rect width="860" height="524" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">上から順に通る。ほとんどは自動（LLM・分類器）で、一部は人が審査</text>
<rect x="60.0" y="52.0" width="400.0" height="59.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="72.0" y="79.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">① 広告主</text>
<text x="72.0" y="99.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">正当な事業者か・資格・詐欺のリスク（事業者の確認は最大 7 営業日）</text>
<rect x="524.0" y="52.0" width="312.0" height="59.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="536.0" y="78.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">事業者の確認の失敗・業種が対象外</text>
<text x="536.0" y="98.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">結果はメールで届き、異議はメールのリンクから</text>
