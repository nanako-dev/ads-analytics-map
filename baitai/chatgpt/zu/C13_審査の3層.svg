<text x="72.0" y="198.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">タイトル・本文・画像・LP のどれか 1 つでも反すれば却下</text>
