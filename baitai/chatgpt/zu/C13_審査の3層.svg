<polyline points="60.0,390.0 36.0,390.0 36.0,180.5 54.0,180.5" fill="none" stroke="#909A8B" stroke-width="1.25"/>
<path d="M60.0 180.5 l-7 -4 v8 z" fill="#909A8B"/>
