<text x="536.0" y="296.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">敏感な会話（心の健康・個人のヘルスケア・政治 な</text>
<text x="536.0" y="314.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">ど）には出ない</text>
