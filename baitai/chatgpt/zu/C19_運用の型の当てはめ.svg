<title id="c19t">C19 運用の型の当てはめ</title>
<desc id="c19d">運用の型の規則 175 個を ChatGPT に当てはめた区分（当てはめ）。そのまま使える 54、言い換えが要る 85、使えない 36。参考の Meta は 53・100・22。類ごとでは、範囲の類が 17 個中 12 個使えない。使えない 36 の理由は、学習・品質・A/B などの表示や機能が公式に記載なし 13、Google 固有の機能が無い 12、検索の仕組み（キーワード・検索語句・マッチタイプ）が無い 9、計測の仕組みが違う 2（理由の分け方はこの図で 36§2-1 の各行から数えた）。2026-11-18 時点。</desc>
