<rect x="560.1" y="297.0" width="159.9" height="22.0" fill="#FFE7B8"/>
<text x="567.1" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="start">EEA・スイスでは使えない</text>
<rect x="160.0" y="396.0" width="540.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="5 3"/>
<text x="174.0" y="422.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">Negative Phrases</text>
