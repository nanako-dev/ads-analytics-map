<text x="72.0" y="174.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">日本は都道府県と郵便番号。市 <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">？</tspan>（試した範囲で見当たらない）。除外地域も指定できる</text>
<rect x="92.0" y="200.0" width="676.0" height="76.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="106.0" y="226.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">端末 5 種</text>
<rect x="106.0" y="238.0" width="123.2" height="28.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="167.6" y="257.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">Android アプリ</text>
