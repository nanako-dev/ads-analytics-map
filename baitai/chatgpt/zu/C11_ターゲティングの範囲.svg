<text x="331.6" y="422.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="start">資格のある広告主だけ</text>
<text x="174.0" y="446.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">会話（掲載）を狭く除く。資格の条件・日本で使えるか <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">？</tspan></text>
<rect x="24.0" y="500.0" width="812.0" height="44.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="40.0" y="528.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">年齢・性別・興味関心で絞る ― 公式に<tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan></text>
<text x="820.0" y="528.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">文脈ヒントも絞り込みには使えない（C10）</text>
<rect x="24.0" y="575.0" width="617.6" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="594.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">絞れるのは 国・地域・端末・顧客リスト（と一部の広告主の Negative Phrases）だけ</text>
<line x1="24.0" y1="614.0" x2="836.0" y2="614.0" stroke="#D9D9D9" stroke-width="1"/>
