<svg viewBox="0 0 860 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c11t c11d" class="fig">
<title id="c11t">C11 ターゲティングの範囲</title>
<desc id="c11d">広告主が絞れる段を、外から内へ狭まる帯で示した模式図（幅は人数の比ではない）。国（1 か国なら明示して含める。指定しなければ利用可能な全地域）、地域（日本は都道府県と郵便番号。市の単位は試した範囲で見当たらない。除外地域も指定できる）、端末 5 種（Android アプリ・Android Web・パソコンの Web・iOS アプリ・iOS Web）、カスタム オーディエンス（含める・入札の倍率は照合後 25,000 人以上、除くは下限なし、EEA・スイスでは使えない）、会話を狭く除く Negative Phrases（資格のある広告主だけ、資格の条件と日本で使えるかは記載なし）。年齢・性別・興味関心の指定は公式に記載なし。2026-11-18 時点。</desc>
<rect width="860" height="650" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">外から内へ狭まる（幅は模式で、人数の比ではない）</text>
<rect x="24.0" y="48.0" width="812.0" height="64.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="74.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">国</text>
<text x="38.0" y="98.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">1 か国だけなら明示して含める（他国を除くだけでは絞れない）。指定しなければ利用可能な全地域</text>
<rect x="58.0" y="124.0" width="744.0" height="64.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
