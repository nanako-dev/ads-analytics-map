<text x="298.8" y="257.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">Android Web</text>
<rect x="368.4" y="238.0" width="123.2" height="28.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
