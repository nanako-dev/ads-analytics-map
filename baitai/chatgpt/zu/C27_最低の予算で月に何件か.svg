<svg viewBox="0 0 860 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c27t c27d" class="fig">
<title id="c27t">C27 最低の予算で月に何件か</title>
<desc id="c27d">日本円の最低の 1 日の予算 2,500 円（公式）から、月の成果の件数を数えた計算。月は 2,500 × 30.4 で約 76,000 円。CPC 300 円（例）なら約 253 クリック、CVR 2%（例）なら約 5 件。CPC と CVR を変えた 9 通り（どちらも例）: CPC 150 円で CVR 1・2・5% なら約 5・10・25 件、300 円で約 3・5・13 件、600 円で約 1・3・6 件。30 件たまるまでの月数も添えた（計算）。日本円の CPC の目安は公式に記載なし。2026-11-18 時点。</desc>
<rect width="860" height="544" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">公式は 2,500 円だけ。CPC・CVR は例、件数は〔計算〕</text>
<rect x="24.0" y="56.0" width="177.5" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="36.0" y="82.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">1 日 2,500 円</text>
<text x="36.0" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">公式の最低（日本円）</text>
<rect x="235.5" y="56.0" width="177.5" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="247.5" y="82.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">月 約 76,000 円</text>
<text x="247.5" y="102.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">× 30.4〔計算〕</text>
