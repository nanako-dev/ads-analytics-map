<svg viewBox="0 0 860 534" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c24t c24d" class="fig">
<title id="c24t">C24 古い記事の記述といま</title>
<desc id="c24d">日付で古くなった記述を、上から時間の順に並べた（間隔は日付の比ではない）。2026-03（報道）チャット内の直接決済を縮小し、Instant Checkout・ACP に対応する記事は古い。今の公式の文書は Wallet・ブラウザ・プラグインの構成で、廃止の公式発表は記載なし。2026-04 から医療・法律・金融の助言の会話は既定で除外しない（報道で表現に差がある）。2026-08-11 に日本で提供開始。2026-10-30 からクリエイティブの強化が既定でオン。2026-11-09 から新規は目標 CPA／CPC で、上限入札は 2027-01-01 に廃止。2026-11-18 時点。</desc>
<rect width="860" height="534" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">上から時間の順（間隔は日付の比ではない）</text>
<text x="172.0" y="58.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#4D4D4D" text-anchor="start">古い記事・思い込み</text>
<text x="506.0" y="58.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">いま（2026-11-18 時点）</text>
<text x="24.0" y="100.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-03</text>
<text x="24.0" y="119.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="start">〔報道〕</text>
<rect x="172.0" y="74.0" width="290.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="184.0" y="97.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">チャット内で即購入（Instant</text>
<text x="184.0" y="118.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">Checkout）・ACP に対応する</text>
<polyline points="468.0,104.0 494.0,104.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M500.0 104.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="506.0" y="74.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="518.0" y="97.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">今の公式の文書は Wallet・ブラウザ・プラグイ</text>
<text x="518.0" y="118.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">ンの構成。廃止の公式発表は <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan></text>
<text x="24.0" y="174.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-04</text>
<text x="24.0" y="193.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="start">△ 報道で表現に差</text>
<rect x="172.0" y="148.0" width="290.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="184.0" y="181.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">医療・法律・お金の相談の会話には出ない</text>
<polyline points="468.0,178.0 494.0,178.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M500.0 178.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="506.0" y="148.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="518.0" y="171.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">「助言」の会話そのものは既定で除外しない。</text>
<text x="518.0" y="192.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">敏感な会話は引き続き出ない</text>
<text x="24.0" y="257.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-08-11</text>
<rect x="172.0" y="222.0" width="290.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="184.0" y="255.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">ChatGPT の広告は米国だけのテスト</text>
<polyline points="468.0,252.0 494.0,252.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M500.0 252.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="506.0" y="222.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="518.0" y="245.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">日本で提供開始。日本の法人がセルフサーブで</text>
<text x="518.0" y="266.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">出稿できる</text>
<text x="24.0" y="331.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-10-30</text>
<rect x="172.0" y="296.0" width="290.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="184.0" y="329.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">書いた広告文がそのまま出る</text>
<polyline points="468.0,326.0 494.0,326.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M500.0 326.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="506.0" y="296.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="518.0" y="319.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">クリエイティブの強化が既定でオン。変わった</text>
<text x="518.0" y="340.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">文面の事前の確認は無い</text>
<text x="24.0" y="405.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="#000000" text-anchor="start">2026-11-09</text>
<rect x="172.0" y="370.0" width="290.0" height="60.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="5 3"/>
<text x="184.0" y="403.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#4D4D4D" text-anchor="start">上限入札で単価を抑える</text>
<polyline points="468.0,400.0 494.0,400.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M500.0 400.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="506.0" y="370.0" width="330.0" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="518.0" y="393.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">新規は目標 CPA／CPC（平均の目標）。上限入</text>
<text x="518.0" y="414.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">札は 2027-01-01 に廃止</text>
