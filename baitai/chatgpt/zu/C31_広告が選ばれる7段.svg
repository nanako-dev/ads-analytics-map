<text x="140.0" y="451.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">関連性と価値の最低基準・入札額・品質を加味した順位・価格</text>
