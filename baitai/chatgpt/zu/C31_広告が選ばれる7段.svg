<svg viewBox="0 0 860 734" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c31t c31d" class="fig">
<title id="c31t">C31 広告が選ばれる 7 段</title>
<desc id="c31d">公式の技術ブログ（日本語版、2026-10-21）が説明する、広告が選ばれるまでの 7 段。1 会話の記憶: 状態を保つ広告セッションで会話の流れを追い、会話をまたぐこともある。2 問いの準備: オーケストレーター（LLM）が会話を要約し、商業的な意図を表す問いを 1 つ以上作る。3 候補の検索: 意味の近い広告を幅広く集める。4 資格のない候補の除外: 有効か、地域などのターゲティング、ポリシー、予算の残り、ペース配分、掲載先との適合、同じ広告主の重複。5 関連性と品質の評価: 意味の関連性、閲覧・クリック・成果の見込み、過去の実績。6 オークション: 関連性と価値の最低基準、入札額、品質を加味した順位、価格。7 最終チェック: 会話の文脈で不適切なら出さない、回答に間に合わなければ出さない。最後に回答の下に 1 つ出る。2026-11-18 時点。</desc>
<rect width="860" height="734" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">公式の技術ブログ S-18（日本語版、2026-10-21）</text>
<rect x="24.0" y="54.0" width="386.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="80.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">① 会話の記憶</text>
<text x="36.0" y="100.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">広告セッションで会話の流れを追う。会話をまたぐことも</text>
<rect x="450.0" y="54.0" width="386.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="80.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">② 問いの準備</text>
<text x="462.0" y="100.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">LLM が会話を要約し、商業的な意図の問いを 1 つ以上作る</text>
