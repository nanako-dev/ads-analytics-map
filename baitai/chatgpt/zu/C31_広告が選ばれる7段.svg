<rect x="160.0" y="492.0" width="540.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="174.0" y="517.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">⑦ 最終チェック</text>
<text x="174.0" y="539.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">不適切なら出さない。回答に間に合わなければ出さない</text>
<polyline points="430.0,556.0 430.0,574.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M430.0 580.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="300.0" y="580.0" width="260.0" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<text x="430.0" y="608.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">回答の下に 1 つ出る</text>
<rect x="24.0" y="659.0" width="503.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="678.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">同じ広告主の広告は重複を除かれる。同じ会話に自社の 2 本は並ばない</text>
<line x1="24.0" y1="698.0" x2="836.0" y2="698.0" stroke="#D9D9D9" stroke-width="1"/>
