<title id="c12t">C12 効果測定で今できること</title>
<desc id="c12d">測りたいこと 3 つの成熟度を、左から「公式に無い」「初期のテスト・検討中」「使える」の 3 段の帯で示す。帰属は使える（ピクセル・コンバージョン API、外部の帰属の会社）。増分は「まだ初期段階」で、Haus・Measured・WorkMagic と地域の実験を検討中、管理画面の中の実験の機能は記載なし。ブランドの測定は Kantar・Cint と初期のテストで、広告主が申し込める形は記載なし。2026-10-05 の発表による。2026-11-18 時点。</desc>
