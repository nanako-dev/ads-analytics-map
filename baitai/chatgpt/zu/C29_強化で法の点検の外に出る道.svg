<rect x="602.0" y="238.0" width="234.0" height="66.0" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-dasharray="5 3"/>
<text x="614.0" y="263.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">サイト内の別のページ（表示事項が</text>
<text x="614.0" y="283.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">無いかもしれない）</text>
<polyline points="568.0,181.0 584.0,181.0 584.0,271.0 596.0,271.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M602.0 271.0 l-7 -4 v8 z" fill="#000000"/>
<rect x="24.0" y="346.0" width="400.0" height="44.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36.0" y="370.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">自動で生まれた表現の責任: <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan></text>
<rect x="436.0" y="346.0" width="400.0" height="44.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="448.0" y="370.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">書き換え後の文面が審査されるか: <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan></text>
<rect x="24.0" y="423.0" width="530.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="442.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">法律の確認を通した案件は、キャンペーンで強化をオフにして公開〔推測〕</text>
<line x1="24.0" y1="462.0" x2="836.0" y2="462.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="482.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">出典: 31§4 ／ C-広告-004・005 ／ help 20001614</text>
