<text x="614.0" y="195.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">翻訳した文（条件は <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan>）</text>
<polyline points="568.0,181.0 584.0,181.0 584.0,193.0 596.0,193.0" fill="none" stroke="#000000" stroke-width="1.25"/>
