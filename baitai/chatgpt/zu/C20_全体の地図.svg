<svg viewBox="0 0 860 822" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c20t c20d" class="fig">
<title id="c20t">C20 ChatGPT の広告の全体の地図</title>
<desc id="c20d">ChatGPT の広告を 4 つの芯で示す模式図。広告主はまず業種と国の門を通る（芯 3: 日本は米国外の扱いで、金融・健康・法律は原則出せない）。広告主は LP・タイトル・本文・文脈ヒントを渡し、絞れるのは国・地域・端末・顧客リストだけ。システムは会話の文脈と意図を引き金に選ぶ（芯 1: キーワードは無い）。広告は回答の下の別枠「スポンサー」に 1 つ出て、回答には影響しない（芯 2）。成果はピクセルとコンバージョン API で戻り、学習に戻る。芯 4 は変化の速さで、2026-08-11 日本で提供開始、09-30 API の既定の集計にビュースルー、10-30 クリエイティブの強化が既定でオン、11-09 目標 CPA／CPC へ、2027-01-01 上限入札の廃止。2026-11-18 時点。</desc>
<rect width="860" height="822" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">4 つの芯（90）と全体の流れ（模式図）</text>
<rect x="370.0" y="50.0" width="120.0" height="34.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="430.0" y="73.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">広告主</text>
<rect x="24.0" y="110.0" width="376.0" height="66.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<rect x="460.0" y="110.0" width="376.0" height="66.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<text x="38.0" y="137.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">芯 3  業種と国の門</text>
<text x="38.0" y="161.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">通れるのは出せる業種だけ</text>
<text x="474.0" y="137.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="600" fill="#000000" text-anchor="start">日本は「米国外」の扱い</text>
<text x="474.0" y="161.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">金融・健康・法律は原則出せない（例外あり、C08）</text>
<polyline points="430.0,84.0 430.0,200.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M430.0 206.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="24.0" y="206.0" width="696.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="232.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告主が渡す</text>
<text x="38.0" y="255.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">材料は LP・タイトル・本文・文脈ヒント。絞れるのは国・地域・端末・顧客リスト</text>
<polyline points="430.0,270.0 430.0,294.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M430.0 300.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="24.0" y="300.0" width="696.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="38.0" y="326.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">システムが選ぶ</text>
<text x="38.0" y="349.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">引き金は会話の文脈と意図。キーワードもマッチタイプも無い</text>
