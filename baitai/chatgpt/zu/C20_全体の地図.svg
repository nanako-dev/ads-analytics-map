<path d="M430.0 488.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="24.0" y="488.0" width="696.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="514.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">計測で戻る</text>
<text x="38.0" y="537.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ピクセル＋コンバージョン API。会話の中身は広告主に渡らない</text>
<polyline points="720.0,520.0 776.0,520.0 776.0,332.0 726.0,332.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M720.0 332.0 l7 -4 v8 z" fill="#000000"/>
<text x="784.0" y="422.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">学習に</text>
<text x="784.0" y="442.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">戻る</text>
<text x="24.0" y="596.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">芯 4  変化が速い（主な変更日）</text>
<line x1="60.0" y1="674.0" x2="800.0" y2="674.0" stroke="#000000" stroke-width="1.25"/>
<text x="60.0" y="698.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">2026-08</text>
<text x="800.0" y="698.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="end">2027-01</text>
<rect x="100.3" y="670.0" width="8.0" height="8.0" fill="#000000"/>
<text x="104.3" y="642.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">08-11</text>
<text x="104.3" y="660.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">日本で提供開始</text>
<rect x="321.9" y="670.0" width="8.0" height="8.0" fill="#000000"/>
<text x="325.9" y="698.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="600" fill="#000000" text-anchor="middle">09-30</text>
<text x="325.9" y="716.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="middle">API の既定の集計にビュースルー</text>
