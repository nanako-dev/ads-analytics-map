<text x="38.0" y="443.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">別枠の「スポンサー」に 1 つ。回答には影響しない</text>
