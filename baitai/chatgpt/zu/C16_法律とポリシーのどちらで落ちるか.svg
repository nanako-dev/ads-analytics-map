<svg viewBox="0 0 860 940" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c16t c16d" class="fig">
<title id="c16t">C16 日本の法律と OpenAI のポリシーのどちらで落ちるか</title>
<desc id="c16d">主な論点ごとに、日本の法律と OpenAI のポリシーのどちらで落ちうるかを色のマスで示す（判定は両方の規定を並べた書き手の読みで、推測）。先に業種で落ちるもの: 健康食品の健康効果・医療の広告・金融の表示事項・個別の求人や物件は、OpenAI の業種の段階で止まる。出せる業種では、効果の誇張・No.1 表示・二重価格・口コミの出どころ・個人情報と外部送信・ダークパターン・なりすまし・「AI が選んだ」の訴求は両方で落ちうる。打消し表示・特商法の表示や定期購入は法律で落ち、OpenAI には専用の規定が見当たらない。体験談と化粧品の効能は法律で落ち、偽の推薦・医療的な効能なら OpenAI でも。差別的な表現と震災・事件への便乗は OpenAI で落ちる。2026-11-18 時点。</desc>
