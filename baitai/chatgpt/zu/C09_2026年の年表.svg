<title id="c09t">C09 2026 年の年表</title>
<desc id="c09d">2026 年の ChatGPT の広告の主な出来事。01-16 方針を発表、02-09 米国でテスト開始、03-26 初期の結果の報告とカナダ・オーストラリア・ニュージーランドから展開すると予告（開始日は公式に記載なし）、05-07 英国・メキシコ・ブラジル・日本・韓国へ広げると予告、06 中旬〜下旬 日本で表示開始と報道（△）、08-11 日本など 5 か国で提供開始、09-10 広告ポリシー v1.6、10-30 クリエイティブの強化が既定でオン、11-09 新規は目標 CPA／目標 CPC。2026-11-18 時点。</desc>
