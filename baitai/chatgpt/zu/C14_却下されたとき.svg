<rect x="24.0" y="348.0" width="812.0" height="76.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="40.0" y="378.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">アカウント・ドメインの判断（業種が対象外など）は、結果のメールの異議のリンクから</text>
<text x="40.0" y="404.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">異議の回数の上限・決まるまでの日数 ― <tspan fill="#B42318" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-weight="700">記載なし</tspan></text>
<rect x="24.0" y="455.0" width="395.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="474.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">サポートは異議の後の手段。先に管理画面で異議を出す</text>
