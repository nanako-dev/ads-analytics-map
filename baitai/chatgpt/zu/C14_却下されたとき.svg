<svg viewBox="0 0 860 530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c14t c14d" class="fig">
<title id="c14t">C14 却下されたとき</title>
<desc id="c14d">広告が却下されたときの分かれ道。「Not serving」の広告にカーソルを当てて理由を読み、原因が分かり直せるなら編集して出し直す（新しい版として再審査）。判定が誤りなら管理画面の異議（Request Review、日本語版は「審査をリクエスト」）が最短。異議から 7 日たっても決まらないか、異議の手段が無いときだけサポート（ads-support@openai.com）へ。アカウント・ドメインの判断は結果のメールのリンクから異議。異議の回数の上限と決まるまでの日数は記載なし。2026-11-18 時点。</desc>
<rect width="860" height="530" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">分かれ道（上から）</text>
<rect x="24.0" y="52.0" width="340.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="78.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">広告が「Not serving」</text>
<text x="36.0" y="98.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">理由を読む（テキスト・画像・LP のどれか）</text>
<polyline points="104.0,110.0 104.0,144.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M104.0 150.0 l-4 -7 h8 z" fill="#000000"/>
