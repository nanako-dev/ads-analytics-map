<text x="36.0" y="176.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">原因が分かり、直せるか</text>
<rect x="544.0" y="147.0" width="292.0" height="58.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="556.0" y="173.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">編集して出し直す</text>
<text x="556.0" y="193.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">新しい版として、もう一度審査される</text>
<polyline points="364.0,176.0 538.0,176.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M544.0 176.0 l-7 -4 v8 z" fill="#000000"/>
<text x="454.0" y="168.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="middle">はい</text>
<polyline points="104.0,202.0 104.0,244.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M104.0 250.0 l-4 -7 h8 z" fill="#000000"/>
<text x="114.0" y="228.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="start">いいえ（判定が誤り）</text>
<rect x="24.0" y="250.0" width="340.0" height="58.0" fill="#C9F7DC" stroke="#000000" stroke-width="1.5"/>
<text x="36.0" y="276.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">管理画面の異議</text>
<text x="36.0" y="296.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Request Review（日本語版は「審査をリクエスト」）</text>
<rect x="242.0" y="259.0" width="110.0" height="22.0" fill="#19E76E"/>
<text x="249.0" y="274.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="600" fill="#000000" text-anchor="start">最短の道（公式）</text>
