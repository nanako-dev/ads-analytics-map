<svg viewBox="0 0 860 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c02t c02d" class="fig">
<title id="c02t">C02 誰に広告が出るか</title>
<desc id="c02d">広告が出うるかの判定の順。ログインしているか（いいえなら全年齢向けの広告だけ）→ プランは Free か Go か（Plus・Pro・Business・Enterprise・Edu は出ない）→ 18 歳以上か（18 歳未満とされたアカウントは出ない）→ 一時チャットでないか → 敏感な話題の会話でないか → 広告が出うる。2026-11-18 時点。</desc>
