<svg viewBox="0 0 860 842" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c06t c06d" class="fig">
<title id="c06t">C06 計測の流れ</title>
<desc id="c06d">広告のクリックで LP の URL に oppref が付き、OpenAI ピクセルがファースト パーティ Cookie に保存し、成果のイベントを event_id 付きで送る。サーバーは保存した oppref を入れてコンバージョン API で同じ id を送り、OpenAI が同じ ID を 1 件にまとめる。クリックの参照が無いときは自動の拡張マッチング（AAM）。日本のアカウントは AAM を広告主が選び、既定値は公式に記載なし。反映の遅れは表示・クリック約 15 分、費用 7〜8 時間、成果 24〜48 時間。2026-11-18 時点。</desc>
