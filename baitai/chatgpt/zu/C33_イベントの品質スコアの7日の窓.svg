<svg viewBox="0 0 860 514" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c33t c33d" class="fig">
<title id="c33t">C33 イベントの品質スコアの 7 日の窓</title>
<desc id="c33d">イベントの品質スコア（EQS）は、完了した 7 暦日分のデータで毎日更新する。例として 8 日目に設定を直すと、9 日目の点数の窓には直した後の日が 7 日のうち 1 日、11 日目は 3 日、13 日目は 5 日、15 日目は 7 日すべてになり、直した効果は古いイベントが窓から抜けるにつれて少しずつ出る（窓の位置は単純化した模式）。点数は成果の予測ではない。コンバージョン API のイベントは行動から 1 時間以内に届いているかを点検する。点数の範囲と良し悪しの目安は記載なし。2026-11-18 時点。</desc>
