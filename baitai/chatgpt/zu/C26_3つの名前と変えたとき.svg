<text x="589.3" y="169.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">事業者の審査をやり直し</text>
<polyline points="706.7,190.0 706.7,212.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M706.7 218.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="577.3" y="218.0" width="258.7" height="50.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
