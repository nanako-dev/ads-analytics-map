<text x="604.0" y="387.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">ない</text>
<polyline points="552.0,369.5 586.0,369.5" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M592.0 369.5 l-7 -4 v8 z" fill="#000000"/>
<rect x="24.0" y="429.0" width="812.0" height="40.0" fill="#FFE7B8" stroke="#909A8B" stroke-width="1"/>
<text x="38.0" y="455.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#000000" text-anchor="start">△ 下限の大きさは 256×256 と 128×128 の 2 つの書き方がある（大きいほうで用意する〔推測〕）</text>
<rect x="24.0" y="500.0" width="365.0" height="28.0" fill="#C9F7DC"/>
<text x="34.0" y="519.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">配信中にブランド名を変えない（承認まで止まる）</text>
<line x1="24.0" y1="539.0" x2="836.0" y2="539.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="559.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#676E64" text-anchor="start">出典: C-アカウント-003 ／ C-アセット-007 ／ help 20001213</text>
</svg>
