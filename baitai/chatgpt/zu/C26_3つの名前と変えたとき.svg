<text x="36.0" y="386.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">JPEG・PNG・WebP</text>
<rect x="308.0" y="340.0" width="244.0" height="59.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="320.0" y="366.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">審査の理由が missing_favicon</text>
<polyline points="268.0,369.5 302.0,369.5" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M308.0 369.5 l-7 -4 v8 z" fill="#000000"/>
