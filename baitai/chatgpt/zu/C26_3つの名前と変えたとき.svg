<svg viewBox="0 0 860 575" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c26t c26d" class="fig">
<title id="c26t">C26 3 つの名前と、変えたとき</title>
<desc id="c26d">広告アカウントの 3 つの名前と、変えたときに起きること。アカウント名は広告マネージャーの中だけの名前で、変えても審査なし。ブランド名は広告に並べて表示される公開の名前で、変えるとブランド審査が始まり、承認まで配信が止まる。法人名は請求と事業者の確認に使う登録名で、変えると事業者の審査をやり直し、配信が止まることがある。2026-09-25 から 3 つを別々に変えられる。アイコン（JPEG・PNG・WebP）が無いとブランド審査の理由が missing_favicon になり、ブランド審査が通るまで広告は出ない。アイコンの下限は 256×256 と 128×128 の 2 つの書き方がある（△）。2026-11-18 時点。</desc>
<rect width="860" height="575" fill="#FFFFFF"/>
<text x="836.0" y="28.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="500" fill="#676E64" text-anchor="end">2026-11-18 時点</text>
<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">2026-09-25 から 3 つを別々に変えられる（設定 &gt; 一般）</text>
<rect x="24.0" y="56.0" width="258.7" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="83.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">アカウント名</text>
<text x="36.0" y="104.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">広告マネージャーの中だけの名前</text>
<polyline points="153.3,116.0 153.3,138.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M153.3 144.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="24.0" y="144.0" width="258.7" height="124.0" fill="#E6E6E6" stroke="#909A8B" stroke-width="1"/>
<text x="36.0" y="208.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">審査なし</text>
<rect x="300.7" y="56.0" width="258.7" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="312.7" y="83.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">ブランド名</text>
<text x="312.7" y="104.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">広告に並べて表示される公開の名前</text>
<polyline points="430.0,116.0 430.0,138.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M430.0 144.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="300.7" y="144.0" width="258.7" height="46.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1"/>
<text x="312.7" y="169.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="500" fill="#000000" text-anchor="start">ブランド審査が始まる</text>
<polyline points="430.0,190.0 430.0,212.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M430.0 218.0 l-4 -7 h8 z" fill="#000000"/>
<rect x="300.7" y="218.0" width="258.7" height="50.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="312.7" y="245.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">承認まで配信が止まる</text>
<rect x="577.3" y="56.0" width="258.7" height="60.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="589.3" y="83.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">法人名</text>
<text x="589.3" y="104.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">請求と事業者の確認に使う登録名</text>
<polyline points="706.7,116.0 706.7,138.0" fill="none" stroke="#000000" stroke-width="1.25"/>
<path d="M706.7 144.0 l-4 -7 h8 z" fill="#000000"/>
