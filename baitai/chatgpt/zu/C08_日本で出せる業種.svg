<title id="c08t">C08 日本で出せる業種</title>
<desc id="c08d">ヘルスケア・金融・法律の主な区分を、米国と米国外（日本を含む）の 2 列で、可・選ばれた広告主だけ・不可に分けたマス。米国外で可は「医療・健康のソフトウェアとインフラ」と「金融ソフトウェア」だけ。法律サービスは米国外は不可。サプリ・生理用品・ウェアラブルはポリシーの本文と表の書き方が違う（△）。2026-11-18 時点。</desc>
