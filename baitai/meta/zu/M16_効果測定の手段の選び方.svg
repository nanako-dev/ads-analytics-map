<text x="312.0" y="230.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">過去 1 年に開始したキャンペーンで</text>
<text x="312.0" y="249.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">消化 5,000 米ドル以上・500 件以上</text>
<text x="312.0" y="268.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">＋ CAPI で EMQ 5 超 など</text>
