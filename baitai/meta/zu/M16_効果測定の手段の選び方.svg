<svg viewBox="0 0 860 531" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m16t m16d" class="fig">
<title id="m16t">M16 効果測定の手段の選び方</title>
<desc id="m16d">「どちらが良いか」は A/B テスト（誰でも使える、1〜30 日、信頼性 65%）、「何件増えたか」はコンバージョンリフト、「認知が上がったか」はブランドリフトで、後の 2 つは予算と件数の条件に届くかで分かれる。少額のアカウントは A/B テストだけが届く前提で、増分は推定の列や止める実験で代える。</desc>
<rect width="860" height="531" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">道具は問いで決まる。［テスト］ツールの 3 種類はどれも作成に追加費用なし</text>
<rect x="260.0" y="42.0" width="340.0" height="44.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
