<text x="588.0" y="419.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">比べる（推定の指標）</text>
<rect x="24.0" y="479.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="489.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">A/B テストは A も B も広告を出すので、「どちらが良いか」だけに答え、「増えたか」には答えない</text>
