<text x="312.0" y="346.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">信頼性 90% 以上</text>
<line x1="530.0" y1="283.0" x2="530.0" y2="361.0" stroke="#000000" stroke-width="1.25" stroke-dasharray="4 3"/>
