<svg viewBox="0 0 860 472" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m24t m24d" class="fig">
<title id="m24t">M24 止める実験と「7 日」の境目</title>
<desc id="m24d">広告セットを 7 日以上止めると再開の時点で情報収集期間に入り直すが、7 日未満の停止は大幅な編集の一覧に無い。少額で増分を確かめる止める実験は 7 日未満の停止で行い、台帳の全体の申込みで比べる（〔推測〕、オン 2 週・オフ 2 週の繰り返しは毎回やり直しになる）。</desc>
<rect width="860" height="472" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔推測〕止める実験は「止めたら台帳の申込みが減ったか」で見る。止める日数で学習が変わる</text>
<text x="700.0" y="52.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">情報収集期間に入り直す</text><rect x="684.0" y="42.0" width="10.0" height="10.0" fill="#FFE7B8" stroke="#000000" stroke-width="0.75"/><text x="642.0" y="52.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">停止</text><rect x="626.0" y="42.0" width="10.0" height="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.75"/><text x="584.0" y="52.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">配信</text><rect x="568.0" y="42.0" width="10.0" height="10.0" fill="#F5F8F4" stroke="#000000" stroke-width="0.75"/>
<text x="24.0" y="124.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">7 日未満の停止</text>
<text x="24.0" y="142.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">例 5 日止める</text>
<rect x="200.0" y="104.0" width="252.8" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<rect x="452.8" y="104.0" width="90.3" height="44.0" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="497.9" y="131.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="middle">停止</text>
<rect x="543.1" y="104.0" width="288.9" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="589.2" y="131.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">再開しても大幅な編集の一覧に無い</text>
<text x="24.0" y="198.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">7 日以上の停止</text>
<text x="24.0" y="216.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">例 10 日止める</text>
