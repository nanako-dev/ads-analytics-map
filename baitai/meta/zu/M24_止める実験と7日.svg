<text x="832.0" y="368.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">日（日数は例）</text>
<rect x="24.0" y="394.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="404.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">少額の止める実験は 7 日未満の停止で〔推測〕。比べるのは管理画面ではなく台帳の申込み</text>
<text x="42.0" y="430.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">手動のオン・オフで A と B を比べる略式の A/B テストは、Meta が勧めない（別の話）</text>
