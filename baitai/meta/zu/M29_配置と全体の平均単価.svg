<svg viewBox="0 0 860 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m29t m29d" class="fig">
<title id="m29t">M29 配置を外すと全体の単価が上がる例</title>
<desc id="m29d">最大数量では配信システムが全配置の機会から安いものを選んで全体の平均単価を抑えるので、ヘルプの例では単価 5 ドルの Instagram を外すと、Audience Network で 7 ドルの機会まで取りにいき平均が 3 ドルから 3.25 ドルに上がる（1 件ごとの内訳は〔計算〕）。配置別の単価が高くても効率が悪いとは限らないので、配置別の単価だけで配置を外さない。</desc>
<rect width="860" height="410" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">最大数量では、配置ごとではなく全体の平均単価を抑える（ヘルプの例。単位は米ドル）</text>
<text x="725.2" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">高い機会（7 ドル）</text><rect x="709.2" y="44.0" width="10.0" height="10.0" fill="#FFE7B8" stroke="#000000" stroke-width="0.75"/>
<text x="24.0" y="122.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">3 配置とも使う</text>
