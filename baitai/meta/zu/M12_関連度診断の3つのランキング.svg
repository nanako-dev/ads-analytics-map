<text x="312.0" y="88.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">表示・反応・成果</text>
<rect x="576.0" y="44.0" width="260.0" height="62.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
