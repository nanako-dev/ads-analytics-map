<svg viewBox="0 0 860 670" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m12t m12d" class="fig">
<title id="m12t">M12 広告関連度診断の 3 つのランキング</title>
<desc id="m12d">関連度診断は品質・エンゲージメント率・コンバージョン率の 3 つの順位で、同じオーディエンス（コンバージョン率は同じ最適化の目的も）の広告と比べた 5 段階の帯で出るが、オークションの入力ではない。成績の悪い広告だけを 3 つの組み合わせで読み、オーディエンスの違う広告どうしでは比べない。</desc>
<rect width="860" height="670" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">関連度診断は、配信の結果から作る診断。オークションの入力ではない</text>
<rect x="24.0" y="44.0" width="240.0" height="62.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
