<svg viewBox="0 0 860 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m10t m10d" class="fig">
<title id="m10t">M10 却下されたとき</title>
<desc id="m10d">却下されたら消さずに残し、規定に当たっていたなら直して出し、判定が誤りなら再審査を頼む（再び却下されると同じ広告ではもう頼めない）。直しても消しても違反の記録は残り、数えなくなるのは再審査で取り消されたときだけ。</desc>
<rect width="860" height="452" fill="#FFFFFF"/>
<rect x="24.0" y="20.0" width="200.0" height="48.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">広告が却下された</text>
<line x1="224.0" y1="44.0" x2="253.0" y2="44.0" stroke="#000000" stroke-width="1.25"/><path d="M260.0 44.0 L253.0 40.0 L253.0 48.0 Z" fill="#000000"/>
<rect x="260.0" y="20.0" width="576.0" height="48.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="274.0" y="50.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="400" fill="#000000" text-anchor="start">理由を確かめる（ビジネスサポートホーム）</text>
<rect x="24.0" y="84.0" width="812.0" height="42.0" fill="#FFE7B8"/>
<text x="38.0" y="111.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">消さずにオフにして残す。消すと再審査を頼めなくなることがある</text>
<rect x="24.0" y="154.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">編集して再提出</text>
<text x="38.0" y="206.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">直して公開 → 自動で審査</text>
<rect x="300.0" y="154.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="314.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">新しく作る</text>
<text x="314.0" y="206.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">新しい広告として審査</text>
<rect x="576.0" y="154.0" width="260.0" height="72.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
<text x="590.0" y="182.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">再審査を頼む</text>
<text x="590.0" y="206.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">人の審査が中心。48 時間以内に努める</text>
<line x1="154.0" y1="226.0" x2="154.0" y2="253.0" stroke="#000000" stroke-width="1.25"/><path d="M154.0 260.0 L158.0 253.0 L150.0 253.0 Z" fill="#000000"/>
<line x1="706.0" y1="226.0" x2="706.0" y2="243.0" stroke="#000000" stroke-width="1.25"/>
<line x1="430.0" y1="243.0" x2="706.0" y2="243.0" stroke="#000000" stroke-width="1.25"/>
<line x1="430.0" y1="243.0" x2="430.0" y2="253.0" stroke="#000000" stroke-width="1.25"/><path d="M430.0 260.0 L434.0 253.0 L426.0 253.0 Z" fill="#000000"/>
<line x1="706.0" y1="243.0" x2="706.0" y2="253.0" stroke="#000000" stroke-width="1.25"/><path d="M706.0 260.0 L710.0 253.0 L702.0 253.0 Z" fill="#000000"/>
<text x="714.0" y="238.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">再審査の結果</text>
<rect x="24.0" y="260.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="38.0" y="288.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">通れば配信</text>
<text x="38.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">落ちたら、また直せる</text>
<rect x="300.0" y="260.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="314.0" y="288.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">取り消された</text>
<text x="314.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">違反に数えない。自動で配信へ</text>
<rect x="576.0" y="260.0" width="260.0" height="72.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="590.0" y="288.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">再び却下された</text>
<text x="590.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">同じ広告では、もう頼めない</text>
<rect x="24.0" y="352.0" width="812.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="40.0" y="387.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">直しても、消しても、違反の記録はアカウントに残る</text>
<text x="24.0" y="442.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: ヘルプ 1210227555661027 ／ M-ポリシー-023〜027 ／ 34 §5-2 ／ 2026-11-18 時点</text>
</svg>
