<svg viewBox="0 0 860 614" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m17t m17d" class="fig">
<title id="m17t">M17 日本の法律と Meta の規定のどちらで落ちるか</title>
<desc id="m17d">No.1 表示・二重価格・ビフォーアフターなどは Meta の審査を通っても日本の法律で落ち、「〜でお悩みのあなたへ」や CFD は日本の法律では通っても Meta の規定で落ちる（どちらで落ちるかは書き手の読み〔推測〕）。Meta の承認を法的に問題ない根拠にせず、両方にかかる論点は両側で別々に点検する。</desc>
<rect width="860" height="614" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔推測〕両方の規定の文言を並べた書き手の読み。審査や行政の結果は保証しない</text>
<rect x="24.0" y="44.0" width="524.0" height="448.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<rect x="312.0" y="68.0" width="524.0" height="448.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<rect x="312.0" y="68.0" width="236.0" height="424.0" fill="#E6E6E6"/>
<rect x="24.0" y="44.0" width="524.0" height="448.0" fill="none" stroke="#000000" stroke-width="1.5"/>
<rect x="312.0" y="68.0" width="524.0" height="448.0" fill="none" stroke="#000000" stroke-width="1.5"/>
<text x="40.0" y="70.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">日本の法律で落ちる</text>
<text x="40.0" y="92.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">法だけ: Meta の審査は通りうる</text>
<text x="820.0" y="94.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="end">Meta の規定で落ちる</text>
<text x="820.0" y="116.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="end">Meta だけ: 法では通る文でも</text>
<text x="430.0" y="106.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="middle">両方</text>
<rect x="40.0" y="118.0" width="84.3" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="137.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">No.1 表示</text><rect x="40.0" y="154.0" width="196.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><rect x="52.0" y="164.0" width="10" height="10" fill="#FFA9FD"/><text x="68.0" y="173.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">打消し表示（線がずれる）</text><rect x="40.0" y="190.0" width="76.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="209.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">二重価格</text><rect x="40.0" y="226.0" width="245.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="245.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ビフォーアフター（美容・健康食品）</text><rect x="40.0" y="262.0" width="193.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="281.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">医療広告の体験談・術前術後</text><rect x="40.0" y="298.0" width="180.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="317.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">体験談（個人の感想です）</text><rect x="40.0" y="334.0" width="141.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="353.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">化粧品の効能の範囲</text><rect x="40.0" y="370.0" width="193.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="389.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">金商法・貸金業法の表示事項</text><rect x="40.0" y="406.0" width="167.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="425.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">特商法の表示・定期購入</text><rect x="40.0" y="442.0" width="115.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="461.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">賭博・公営競技</text>
<rect x="564.0" y="142.0" width="193.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="161.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">「〜でお悩みのあなたへ」型</text><rect x="564.0" y="178.0" width="154.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="197.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">容姿の劣等感をあおる</text><rect x="564.0" y="214.0" width="189.6" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="233.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">CFD・バイナリーオプション</text><rect x="564.0" y="250.0" width="141.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="269.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">処方薬（日本向け）</text><rect x="564.0" y="286.0" width="160.2" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="305.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">90 日未満の短期ローン</text><rect x="564.0" y="322.0" width="128.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="576.0" y="341.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">著名人の無断使用</text>
<rect x="324.0" y="118.0" width="212.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="334.0" y="137.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">優良誤認（極端な誇張）</text>
