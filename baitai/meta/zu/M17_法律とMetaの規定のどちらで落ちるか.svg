<rect x="324.0" y="442.0" width="212.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="334.0" y="461.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">ダークパターン</text>
<rect x="24.0" y="538.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="548.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">Meta の審査が通りやすい所ほど、日本の法律の確認が残る。承認を「法的に問題ない」の根拠にしない</text>
<text x="42.0" y="572.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">両方にかかる所は観点が違う: 法は「何を表示したか」、Meta は「何を宣伝し、誰に出し、何を聞いたか」</text>
<text x="24.0" y="604.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 31 §2・§2-1 ／ Meta 広告規定（transparency.meta.com）／ G31 ／ 2026-11-18 時点</text>
</svg>
