<text x="448.0" y="250.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">［オーディエンスをさらに</text>
<text x="448.0" y="270.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">制限する］</text>
<text x="448.0" y="291.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">年齢・性別なども制御にする</text>
<rect x="642.0" y="218.0" width="194.0" height="96.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="654.0" y="251.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">提案</text>
<text x="654.0" y="272.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">年齢・性別・詳細・含めるカ</text>
<text x="654.0" y="290.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">スタム・類似</text>
