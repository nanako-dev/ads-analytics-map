<svg viewBox="0 0 860 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m31t m31d" class="fig">
<title id="m31t">M31 オーディエンスの条件の置き場所</title>
<desc id="m31d">外の人に出ると困る条件は、全キャンペーン共通ならアカウント制御、そのキャンペーンだけならオーディエンス制御に置き、困らない条件は提案として渡す。どうしても絞りたいときは［オーディエンスをさらに制限する］で制御にできるが Advantage+ オーディエンスを手放す（仕分けは〔推測〕、各機能の扱いは公式）。</desc>
<rect width="860" height="484" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔推測〕「誰に出す・出さない」の条件は、外の人に出て困るかで置き場所を分ける</text>
<rect x="220.0" y="46.0" width="420.0" height="44.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
