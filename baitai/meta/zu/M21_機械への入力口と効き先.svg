<text x="38.0" y="295.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">換える</text>
<rect x="106.0" y="274.0" width="161.5" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="118.0" y="293.5" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">入札戦略・目標額・予算</text>
<rect x="24.0" y="326.0" width="380.0" height="122.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
<text x="38.0" y="393.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">教える</text>
