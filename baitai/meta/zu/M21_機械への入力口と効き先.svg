<rect x="24.0" y="598.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="608.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">入札・予算は ⑤ に効くが、④ の予測は良くしない。予測を良くするのは素材と、教える中身</text>
<text x="42.0" y="632.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">提案は囲いではなく手がかり（外の人にも出る）。囲えるのは地域・最低年齢・言語・除外だけ</text>
