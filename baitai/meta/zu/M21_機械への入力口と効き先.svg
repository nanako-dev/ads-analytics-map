<line x1="590.0" y1="122.0" x2="590.0" y2="139.0" stroke="#000000" stroke-width="1.25"/><path d="M590.0 146.0 L594.0 139.0 L586.0 139.0 Z" fill="#000000"/>
<rect x="560.0" y="146.0" width="248.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="572.0" y="176.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">② その人を対象に含む広告を集める</text>
<line x1="590.0" y1="196.0" x2="590.0" y2="213.0" stroke="#000000" stroke-width="1.25"/><path d="M590.0 220.0 L594.0 213.0 L586.0 213.0 Z" fill="#000000"/>
<rect x="560.0" y="220.0" width="248.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="572.0" y="250.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#4D4D4D" text-anchor="start">③ 候補を絞る（取り出し）</text>
<line x1="590.0" y1="270.0" x2="590.0" y2="287.0" stroke="#000000" stroke-width="1.25"/><path d="M590.0 294.0 L594.0 287.0 L586.0 287.0 Z" fill="#000000"/>
<rect x="560.0" y="294.0" width="248.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="572.0" y="324.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">④ 推定アクション率・品質を予測</text>
<line x1="590.0" y1="344.0" x2="590.0" y2="361.0" stroke="#000000" stroke-width="1.25"/><path d="M590.0 368.0 L594.0 361.0 L586.0 361.0 Z" fill="#000000"/>
<rect x="560.0" y="368.0" width="248.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="572.0" y="398.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#000000" text-anchor="start">⑤ 総合価値が最も高い広告を出す</text>
<line x1="590.0" y1="418.0" x2="590.0" y2="435.0" stroke="#000000" stroke-width="1.25"/><path d="M590.0 442.0 L594.0 435.0 L586.0 435.0 Z" fill="#000000"/>
