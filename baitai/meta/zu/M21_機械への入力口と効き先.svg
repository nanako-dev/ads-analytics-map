<svg viewBox="0 0 860 674" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m21t m21d" class="fig">
<title id="m21t">M21 機械への入力口と効き先</title>
<desc id="m21d">運用者が動かせるのは、候補を囲う制約、予測の材料になる素材と提案、入札と量を決める入札・予算、正解を教える目的・最適化イベント・計測で、それぞれ 1 回の表示の別の段に効く〔当てはめ〕。入札・予算は予測を良くしないので、予測を良くしたいときは素材と教える中身を直す。</desc>
<rect width="860" height="674" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔当てはめ〕左は運用者の入力口（運用の型の類）、右は 1 回の表示で機械の中で起きること</text>
<text x="712.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">公開後は変えられない</text><rect x="696.0" y="44.0" width="10.0" height="10.0" fill="#FFD6D6" stroke="#000000" stroke-width="0.75"/>
<rect x="560.0" y="72.0" width="248.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
