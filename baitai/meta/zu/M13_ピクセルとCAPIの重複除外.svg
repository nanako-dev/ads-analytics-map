<title id="m13t">M13 ピクセルとコンバージョン API の重複除外</title>
<desc id="m13d">同じ購入をピクセル（ブラウザ）と CAPI（サーバー）の両方で送り、event_name と event_id（ピクセルは eventID）が一致すれば Meta が 1 件にする。ID がずれると二重に数えるので、CAPI を入れたあとはイベントマネージャの［イベントのテスト］で重複除外を確かめる。</desc>
