<svg viewBox="0 0 860 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m25t m25d" class="fig">
<title id="m25t">M25 「出ない・高い」の切り分けの順</title>
<desc id="m25d">配信ステータス → 予算と上限 → 構造 → 品質 → 入札 → オーディエンスと配置の順に確かめ、当たった所で止まる。表示がほぼ 0 なら、二段階認証・広告主の認証・支払い・違反ドメインなど広告の中身の外の原因を先に見て、status と effective_status を見比べる。</desc>
<rect width="860" height="632" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">「出ない・高い」は上から順に確かめ、当たった所で止まる</text>
<text x="24.0" y="56.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">順番</text>
