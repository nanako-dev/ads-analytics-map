<text x="80.0" y="534.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">絞りすぎていないか、配置に合う素材があるか</text>
