<text x="80.0" y="116.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">情報収集中・不十分、入札価格が制限、過少クリエイティブ・広告疲れ、審</text>
<text x="80.0" y="134.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">査中・却下</text>
<rect x="24.0" y="70.0" width="44.0" height="80.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.25"/>
