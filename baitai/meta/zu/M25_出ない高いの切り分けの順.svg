<text x="80.0" y="214.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">Meta の 1 日の上限予算、アカウント・キャンペーンの上限予算</text>
