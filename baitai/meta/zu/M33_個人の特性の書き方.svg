<svg viewBox="0 0 860 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m33t m33d" class="fig">
<title id="m33t">M33 個人の特性に触れる文の通る・落ちる</title>
<desc id="m33d">落ちるのは、見る人を指す言い方（「あなたは」「他の」「あなたの近くの」）で一覧の特性（健康・財政状態・年齢など）を断定・暗示する文で、特性に触れても商品や集団が主語なら公式の例では通る。日本の定番「〜でお悩みのあなたへ」は悩みが特性なら落ちる型なので、専門家やサービスを主語に書き換える（〔推測〕）。</desc>
<rect width="860" height="484" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">見る人の個人の特性を断定・暗示すると落ちる（並べ方は書き手。例は公式の例の型）</text>
<rect x="246.0" y="50.0" width="290.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<rect x="546.0" y="50.0" width="290.0" height="56.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="258.0" y="74.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">特性に触れない</text>
<text x="558.0" y="74.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">一覧の特性に触れる</text>
<text x="558.0" y="94.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">健康・財政状態・年齢・宗教・犯罪歴など</text>
<rect x="24.0" y="116.0" width="212.0" height="128.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="146.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">見る人を指さない</text>
<text x="36.0" y="168.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">商品・サービス・集団が主語</text>
<rect x="246.0" y="116.0" width="290.0" height="128.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="260.0" y="148.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">通る</text>
<text x="260.0" y="174.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ふつうの商品・サービスの説明</text>
<rect x="546.0" y="116.0" width="290.0" height="128.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="560.0" y="148.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">通る</text>
<text x="560.0" y="174.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">「新しい糖尿病の治療が登場」「うつのカウ</text>
<text x="560.0" y="194.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ンセリング」「高齢者と出会いましょう」</text>
<rect x="24.0" y="254.0" width="212.0" height="128.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="36.0" y="284.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">見る人を指す</text>
<text x="36.0" y="306.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">「あなたは」「他の」「あなたの</text>
<text x="36.0" y="325.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">近くの」</text>
<rect x="246.0" y="254.0" width="290.0" height="128.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="260.0" y="286.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">通る</text>
<text x="260.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">特性と関係しない「あなた」。例「あなたに</text>
<text x="260.0" y="332.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ぴったりの保険」〔推測〕</text>
<rect x="546.0" y="254.0" width="290.0" height="128.0" fill="#FFD6D6" stroke="#000000" stroke-width="1.5"/>
<text x="560.0" y="286.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">落ちる</text>
<text x="560.0" y="312.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">「あなたは糖尿病ですか？」「あなたは破産</text>
<text x="560.0" y="332.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">していますか？」「他の高齢者と出会いましょ</text>
<text x="560.0" y="352.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">う」</text>
<rect x="24.0" y="406.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="416.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">〔推測〕「〜でお悩みのあなたへ」は、悩みが健康・財政などの特性なら右下に入る</text>
<text x="42.0" y="442.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">書き換えは、特性ではなく商品・サービス・専門家を主語にする〔推測〕</text>
<text x="24.0" y="474.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 広告規定 privacy-violations-personal-attributes ／ M-ポリシー-031 ／ 34 §2-9 ／ 2026-11-18 時点</text>
</svg>
