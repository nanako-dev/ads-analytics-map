<title id="m09t">M09 審査のやり直しになる編集</title>
<desc id="m09d">ターゲット・クリエイティブ・最適化・課金対象イベントを変えると審査し直し（ほとんど 24 時間以内）、入札価格・予算・掲載期間の変更では審査しない。配信中の素材の差し替えは審査で止まる前提で、予備の素材と時間を見ておく。</desc>
