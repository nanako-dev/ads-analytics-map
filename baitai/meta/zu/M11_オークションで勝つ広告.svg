<title id="m11t">M11 オークションで勝つ広告</title>
<desc id="m11d">勝つのは入札額・推定アクション率・広告の品質の 3 つから決まる総合価値が最も高い広告で、入札が最も高い広告とは限らない。「入札額 × 推定アクション率 ＋ 品質」は 2020 年の解説の式で今のヘルプは式を書かない（△）ので、入札を上げる前に推定アクション率と品質を疑い、単価の評価は結果の単価で行う。</desc>
