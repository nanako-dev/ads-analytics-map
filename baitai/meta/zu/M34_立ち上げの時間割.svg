<svg viewBox="0 0 860 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m34t m34d" class="fig">
<title id="m34t">M34 立ち上げの時間割〔当てはめ〕</title>
<desc id="m34d">最初の 2 週間は最大数量で単価と週の件数をつかみ、14 日に最大数量の実績 ＋10〜20% で目標の初期値を出し、21 日に初めて判定して目標つきへの切り替え（大幅な編集）を決める（時間割は〔当てはめ〕、10〜20%・2 週間・3 週間は公式）。1〜7 日は素材・予算・目標を触らず、予算を上げるのは 3 週間安定してから徐々に。</desc>
<rect width="860" height="640" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔当てはめ〕少額・少量の立ち上げの時間割。いつ、何を触らないかを先に決める</text>
<text x="760.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">触らないもの</text><rect x="744.0" y="44.0" width="10.0" height="10.0" fill="#FFD6D6" stroke="#000000" stroke-width="0.75"/><text x="678.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">目標つき</text><rect x="662.0" y="44.0" width="10.0" height="10.0" fill="#909A8B" stroke="#000000" stroke-width="0.75"/><text x="524.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">最大数量（目標なし）</text><rect x="508.0" y="44.0" width="10.0" height="10.0" fill="#E6E6E6" stroke="#000000" stroke-width="0.75"/>
<text x="168.0" y="82.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">すること</text>
<text x="570.0" y="82.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">触らないもの</text>
<rect x="168.0" y="94.0" width="390.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="120.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">計測のテスト（ピクセルと CAPI で 1 件）、制約と除外の照</text>
<text x="180.0" y="140.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">合、審査を通す</text>
<text x="120.0" y="131.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">0 日</text>
<line x1="139.0" y1="126.0" x2="168.0" y2="126.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="170.0" width="390.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="199.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">事故だけ見る</text>
<rect x="570.0" y="170.0" width="266.0" height="50.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="582.0" y="199.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">素材・予算・目標（大幅な編集）</text>
<text x="120.0" y="200.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">1〜7 日</text>
<line x1="139.0" y1="195.0" x2="168.0" y2="195.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="232.0" width="390.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="261.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">週平均を見る。「情報収集が不十分」なら原因を点検</text>
<rect x="570.0" y="232.0" width="266.0" height="50.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="582.0" y="261.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">1 日の CPA での判断</text>
<text x="120.0" y="262.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">7 日</text>
<line x1="139.0" y1="257.0" x2="168.0" y2="257.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="294.0" width="390.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="320.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">中間点検。最大数量の実績から目標の初期値（＋10〜20%）を</text>
<text x="180.0" y="340.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">出す</text>
<rect x="570.0" y="294.0" width="266.0" height="64.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="582.0" y="330.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">達否の判定</text>
<text x="120.0" y="331.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">14 日</text>
<line x1="139.0" y1="326.0" x2="168.0" y2="326.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="370.0" width="390.0" height="64.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="396.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">初めての判定（50 件以上なら）。目標つきへの切り替えを決</text>
<text x="180.0" y="416.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">める（大幅な編集）</text>
<text x="120.0" y="407.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">21 日</text>
<line x1="139.0" y1="402.0" x2="168.0" y2="402.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="446.0" width="390.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="475.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">安定していれば予算を徐々に（入札の変更は 1 週間あける）</text>
<rect x="570.0" y="446.0" width="266.0" height="50.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="582.0" y="475.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">一度に大きく上げる</text>
<text x="120.0" y="476.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">21 日 ＋ 3 週間</text>
<line x1="139.0" y1="471.0" x2="168.0" y2="471.0" stroke="#000000" stroke-width="1"/>
<rect x="168.0" y="508.0" width="390.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="180.0" y="537.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">評価できる件数がたまらないなら、取り組みを見直す</text>
<text x="120.0" y="538.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">3 か月</text>
<line x1="139.0" y1="533.0" x2="168.0" y2="533.0" stroke="#000000" stroke-width="1"/>
<rect x="132.0" y="94.0" width="14.0" height="308.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<rect x="132.0" y="402.0" width="14.0" height="156.0" fill="#909A8B" stroke="#000000" stroke-width="1"/>
<circle cx="139.0" cy="126.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="195.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="257.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="326.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="402.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="471.0" r="4.5" fill="#000000"/>
<circle cx="139.0" cy="533.0" r="4.5" fill="#000000"/>
<rect x="24.0" y="588.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="598.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">変更は束ねて週 1 回。素材の追加も大幅な編集になる</text>
<text x="24.0" y="630.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 36 §4-5・§4-3 ／ M-入札-013・015・018 ／ M-学習-002・009 ／ 2026-11-18 時点</text>
</svg>
