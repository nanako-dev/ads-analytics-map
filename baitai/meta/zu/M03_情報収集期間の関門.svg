<line x1="96.0" y1="296.0" x2="96.0" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="96.0" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">0</text>
<line x1="182.3" y1="296.0" x2="182.3" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="182.3" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">1</text>
<line x1="268.6" y1="296.0" x2="268.6" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="268.6" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">2</text>
<line x1="354.9" y1="296.0" x2="354.9" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="354.9" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">3</text>
<line x1="441.1" y1="296.0" x2="441.1" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="441.1" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">4</text>
<line x1="527.4" y1="296.0" x2="527.4" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="527.4" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">5</text>
<line x1="613.7" y1="296.0" x2="613.7" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="613.7" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">6</text>
<line x1="700.0" y1="296.0" x2="700.0" y2="301.0" stroke="#000000" stroke-width="1"/>
<text x="700.0" y="318.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">7</text>
<text x="724.0" y="318.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">日</text>
<text x="86.0" y="300.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">0</text>
<text x="86.0" y="201.7" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">25</text>
<text x="86.0" y="103.3" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">50</text>
<text x="86.0" y="44.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">件</text>
<line x1="96.0" y1="50.0" x2="96.0" y2="296.0" stroke="#000000" stroke-width="2"/>
