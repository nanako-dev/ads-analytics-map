<line x1="96.0" y1="99.3" x2="720.0" y2="99.3" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="724.0" y="104.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">約 50 件</text>
<text x="259.9" y="284.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">情報収集期間（新しい広告・広告セット、大幅な編集で始まる）</text>
<polyline points="96.0,296.0 182.3,264.5 268.6,233.1 354.9,201.6 441.1,170.1 527.4,138.7 613.7,107.2 700.0,75.7" fill="none" stroke="#000000" stroke-width="2"/>
<polyline points="96.0,296.0 182.3,280.3 268.6,264.5 354.9,248.8 441.1,233.1 527.4,217.3 613.7,201.6 700.0,185.9" fill="none" stroke="#909A8B" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="629.3" y="93.3" width="12" height="12" fill="#19E76E"/>
<text x="341.9" y="195.6" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">例 A: 1 日 8 件</text>
<text x="623.3" y="83.3" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">約 50 件に届いて抜ける</text>
<rect x="406.6" y="207.9" width="287.4" height="52.0" fill="#FFE7B8"/>
<text x="684.0" y="227.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="end">例 B: 1 日 4 件 → 7 日で 28 件</text>
<text x="684.0" y="248.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">届きそうにない →「情報収集が不十分」</text>
<text x="24.0" y="348.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ショップ広告は件数の条件が別: ウェブサイト経由 17 件以上 かつ Meta 経由 5 件以上の購入</text>
<line x1="24.0" y1="382.0" x2="836.0" y2="382.0" stroke="#D9D9D9" stroke-width="1"/>
<text x="24.0" y="410.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">「学習」の違い（同じ日数の目盛り）</text>
<text x="750.4" y="410.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Google と違う</text><rect x="734.4" y="400.0" width="10" height="10" fill="#FFA9FD"/>
<text x="24.0" y="448.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Google</text>
<rect x="96.0" y="426.0" width="604.0" height="34.0" fill="#E6E6E6"/>
<text x="106.0" y="448.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">「学習中」の表示は最長 7 日。時間で終わる</text>
<text x="24.0" y="492.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Meta</text>
<rect x="70.0" y="482.0" width="10" height="10" fill="#FFA9FD"/>
<rect x="96.0" y="470.0" width="604.0" height="34.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<line x1="700.0" y1="487.0" x2="803.0" y2="487.0" stroke="#000000" stroke-width="1.25"/><path d="M810.0 487.0 L803.0 483.0 L803.0 491.0 Z" fill="#000000"/>
<text x="106.0" y="492.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">件数で抜ける</text>
<text x="708.0" y="466.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">届かなければ続く</text>
