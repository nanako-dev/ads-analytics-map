<svg viewBox="0 0 860 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m03t m03d" class="fig">
<title id="m03t">M03 情報収集期間の関門</title>
<desc id="m03d">情報収集期間は、最後の大幅な編集から 1 週間以内に約 50 件の結果（選んだアトリビューションの窓の中で数える）がたまると抜ける件数の関門で、届きそうにないと「情報収集が不十分」になる。Google の「学習中」のように 7 日待てば終わるものではないので、広告セットは週 50 件に届く単位まで束ねる。</desc>
<rect width="860" height="548" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">最後の大幅な編集からの日数と、たまった結果の件数（線は作り例）</text>
