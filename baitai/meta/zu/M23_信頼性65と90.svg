<svg viewBox="0 0 860 702" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m23t m23d" class="fig">
<title id="m23t">M23 A/B テストとリフトの「信頼性」</title>
<desc id="m23d">Meta の［テスト］は A/B テストを信頼性 65% 以上、リフトテストを 90% 以上で「統計的に信頼できる」とし、65% は同じテストを繰り返すと 3 回に 1 回強は違う結果になりうる水準（〔計算〕）。素材の入れ替えのような戻せる判断は 65% で採り、構成の作り直しや予算の大きな移動は運用の型の 95% の区間で効いたと言えるまで待つ（〔当てはめ〕）。</desc>
