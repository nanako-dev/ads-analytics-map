<rect x="174.0" y="584.0" width="222.6" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="186.0" y="603.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">期間 1〜30 日（7 日以上を推奨）</text><rect x="404.6" y="584.0" width="262.9" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="416.6" y="603.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">検出力 80% 以上を推奨（保証ではない）</text><rect x="174.0" y="622.0" width="182.9" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="186.0" y="641.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">変えるのは 1 つの変数だけ</text>
