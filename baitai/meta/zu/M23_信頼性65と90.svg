<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">Meta の［テスト］の「信頼性」は、同じテストを繰り返して同じ結果になる見込み</text>
<text x="24.0" y="74.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">A/B テスト</text>
