<svg viewBox="0 0 860 742" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m06t m06d" class="fig">
<title id="m06t">M06 日予算の消化の幅</title>
<desc id="m06d">日予算は日曜〜土曜の週の平均で、1 日は 175%（予算共有オンで 210%）まで使われうるが、週では 7 倍を超えない。点検は週単位で行い、月の予算は週の合計で組む（ヘルプは 75% の引き上げを「一部のアカウントで段階的」とも書き、開発者文書は 25% のまま △）。</desc>
<rect width="860" height="742" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">例: 日予算 $100 のとき（倍率は公式、$100 は例）</text>
<text x="750.4" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Google と違う</text><rect x="734.4" y="16.0" width="10" height="10" fill="#FFA9FD"/>
<text x="24.0" y="58.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">1 日（深夜 0 時まで）</text>
