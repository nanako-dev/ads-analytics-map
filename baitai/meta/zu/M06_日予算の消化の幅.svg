<text x="24.0" y="674.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">7 日の合計 $700 ＝ 週の上限。1 日だけ見て「使いすぎ」と判断しない</text>
