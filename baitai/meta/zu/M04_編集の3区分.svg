<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">広告セットの編集で、情報収集期間をやり直すか</text>
<text x="642.4" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Google の「学習中」は出ない変更</text><rect x="626.4" y="16.0" width="10" height="10" fill="#FFA9FD"/>
