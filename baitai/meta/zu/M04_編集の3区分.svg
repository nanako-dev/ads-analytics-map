<text x="300.0" y="282.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">$100 → $101  ほぼ入らない</text>
<rect x="300.0" y="290.0" width="25.6" height="14.0" fill="#909A8B"/>
<rect x="325.6" y="290.0" width="230.4" height="14.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="300.0" y="322.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">$100 → $1,000  入る可能性が高い</text>
<text x="300.0" y="346.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">何 % からか:</text>
<text x="379.6" y="346.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#B42318" text-anchor="start">記載なし</text>
<rect x="24.0" y="390.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="400.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">変更はまとめて 1 回で。7 日未満の停止は一覧に無い</text>
