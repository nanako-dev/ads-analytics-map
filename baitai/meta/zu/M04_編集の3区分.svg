<svg viewBox="0 0 860 446" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m04t m04d" class="fig">
<title id="m04t">M04 編集の 3 区分</title>
<desc id="m04d">クリエイティブの差し替えや広告を 1 本足すだけでも、その広告セットは情報収集期間に入り直す（Google の「学習中」はこれらでは出ない）。予算・目標の金額は変更の大きさしだいで線は公式に無いので、変更は日を決めてまとめて行い、止めるなら 7 日未満にする。</desc>
