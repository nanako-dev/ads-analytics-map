<rect x="451.0" y="184.0" width="163.0" height="42.0" fill="#C9F7DC" stroke="#909A8B" stroke-width="1"/>
<text x="463.0" y="210.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">性別</text>
