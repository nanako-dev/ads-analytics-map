<text x="24.0" y="28.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">オーディエンス制御（実線）＝ 越えられない境界。配信はこの外に出ない</text>
