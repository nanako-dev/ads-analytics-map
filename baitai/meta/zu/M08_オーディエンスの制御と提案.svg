<text x="36.0" y="216.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">最低年齢（18 歳未満は不可）</text>
<rect x="64.0" y="340.0" width="219.0" height="34.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="76.0" y="362.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">除外するカスタムオーディエンス</text>
<rect x="786.0" y="100.0" width="50.0" height="34.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="798.0" y="122.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">言語</text>
