<text x="24.0" y="406.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">例: 性別で「女性」を提案しても、反応しそうなら男性にも出る（点線は越えるが、実線は越えない）</text>
<text x="24.0" y="432.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">特別な広告カテゴリでは Advantage+ オーディエンスを使えない ／ 類似オーディエンスは除外できない</text>
