<svg viewBox="0 0 860 474" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m08t m08d" class="fig">
<title id="m08t">M08 Advantage+ オーディエンスの制御と提案</title>
<desc id="m08d">Advantage+ オーディエンスで守られるのは地域・最低年齢・除外するカスタムオーディエンス・言語だけで、年齢・性別・詳細ターゲット・含めるカスタムオーディエンスは「提案」として外にも広がる。絞りが必須の商材は制御に置けるもので守るか［オーディエンスをさらに制限する］を使う（特別な広告カテゴリでは使えず、類似は除外できない）。</desc>
