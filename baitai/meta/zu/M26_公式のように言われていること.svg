<svg viewBox="0 0 860 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m26t m26d" class="fig">
<title id="m26t">M26 公式のように言われていることと本文</title>
<desc id="m26d">「予算 20% ルール」「二位価格」「EMQ 6 以上が合格」「画像の文字 20%」などは公式の本文に無く、総合価値の式は 2020 年の解説のもので今のヘルプは 3 要素を挙げるだけ（△）。答えや資料に「公式では」と書く前に rules.csv の印と 94 を確かめ、無ければ「実務家の目安」「未確認」と書く。</desc>
<rect width="860" height="588" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">「公式では」と付ける前に、本文にあるかを確かめる</text>
<text x="772.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">公式の本文</text><rect x="756.0" y="44.0" width="10.0" height="10.0" fill="#F5F8F4" stroke="#000000" stroke-width="0.75"/><text x="642.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">言われていること</text><rect x="626.0" y="44.0" width="10.0" height="10.0" fill="#E6E6E6" stroke="#000000" stroke-width="0.75"/>
<text x="24.0" y="70.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">言われていること</text>
<text x="354.0" y="70.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">本文</text>
<text x="450.0" y="70.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#4D4D4D" text-anchor="start">実際に書いてあること</text>
<rect x="24.0" y="82.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="112.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">予算は 20% までなら学習はリセットされない</text>
<line x1="328.0" y1="107.0" x2="343.0" y2="107.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 107.0 L343.0 103.0 L343.0 111.0 Z" fill="#000000"/>
<rect x="354.0" y="82.0" width="86.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="112.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#B42318" text-anchor="middle">記載なし</text>
<rect x="450.0" y="82.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="111.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">公式は「変更の度合いしだい」。何 % からかの数字は無い</text>
<rect x="24.0" y="142.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="172.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">支払う額は二位価格で決まる</text>
<line x1="328.0" y1="167.0" x2="343.0" y2="167.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 167.0 L343.0 163.0 L343.0 171.0 Z" fill="#000000"/>
<rect x="354.0" y="142.0" width="86.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="172.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#B42318" text-anchor="middle">記載なし</text>
<rect x="450.0" y="142.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="171.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">計算式は無い。あるのは「入札価格を超えて請求しない」</text>
<rect x="24.0" y="202.0" width="300.0" height="68.0" fill="#E6E6E6"/>
<text x="36.0" y="231.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">総合価値 ＝ 入札 × 推定アクション率 ＋ 品</text>
<text x="36.0" y="251.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">質 が今の式</text>
<line x1="328.0" y1="236.0" x2="343.0" y2="236.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 236.0 L343.0 232.0 L343.0 240.0 Z" fill="#000000"/>
<rect x="354.0" y="202.0" width="86.0" height="68.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="241.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">△ 食い違い</text>
<rect x="450.0" y="202.0" width="386.0" height="68.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="240.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">2020 年の解説の式。今のヘルプは 3 つの要素を挙げるだけ</text>
<rect x="24.0" y="280.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="310.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">EMQ は 6 以上が合格</text>
<line x1="328.0" y1="305.0" x2="343.0" y2="305.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 305.0 L343.0 301.0 L343.0 309.0 Z" fill="#000000"/>
<rect x="354.0" y="280.0" width="86.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="310.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#B42318" text-anchor="middle">記載なし</text>
<rect x="450.0" y="280.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="309.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">合格点は無い。公式の数字はリフトの条件の「5 超」だけ</text>
<rect x="24.0" y="340.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="370.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">A/B テストは 2 週間以上、75% 未満なら延長</text>
<line x1="328.0" y1="365.0" x2="343.0" y2="365.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 365.0 L343.0 361.0 L343.0 369.0 Z" fill="#000000"/>
<rect x="354.0" y="340.0" width="86.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="370.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">答えが別</text>
<rect x="450.0" y="340.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="369.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">本文は 1〜30 日、7 日以上を推奨。75% は見当たらない</text>
<rect x="24.0" y="400.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="430.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">画像の文字は 20% まで</text>
<line x1="328.0" y1="425.0" x2="343.0" y2="425.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 425.0 L343.0 421.0 L343.0 429.0 Z" fill="#000000"/>
<rect x="354.0" y="400.0" width="86.0" height="50.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="430.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="700" fill="#B42318" text-anchor="middle">記載なし</text>
<rect x="450.0" y="400.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="429.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">今の広告規定・ヘルプの本文に無い</text>
<rect x="24.0" y="460.0" width="300.0" height="50.0" fill="#E6E6E6"/>
<text x="36.0" y="490.1" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13.5" font-weight="400" fill="#000000" text-anchor="start">リフトは Meta の担当者がいないと使えない</text>
<line x1="328.0" y1="485.0" x2="343.0" y2="485.0" stroke="#000000" stroke-width="1.25"/><path d="M350.0 485.0 L343.0 481.0 L343.0 489.0 Z" fill="#000000"/>
<rect x="354.0" y="460.0" width="86.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="397.0" y="490.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">答えが別</text>
<rect x="450.0" y="460.0" width="386.0" height="50.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="462.0" y="489.9" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">管理画面にセルフサービスの目安がある（API は担当者経由）</text>
<rect x="24.0" y="536.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="546.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">記載の無いものは「公式では」と言わず、「実務家の目安」「未確認」と書く</text>
