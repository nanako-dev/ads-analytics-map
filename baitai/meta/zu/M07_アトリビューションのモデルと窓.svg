<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">① 広告セットでモデルを選ぶ（公開後は変えられない）</text>
<rect x="24.0" y="40.0" width="260.0" height="72.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/>
