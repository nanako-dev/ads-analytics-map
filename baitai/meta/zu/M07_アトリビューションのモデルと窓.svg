<svg viewBox="0 0 860 494" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m07t m07d" class="fig">
<title id="m07t">M07 アトリビューションのモデルと窓</title>
<desc id="m07d">アトリビューションはまず広告セットでモデル（標準・インクリメンタル・カスタム）を選び、標準のときだけ窓（クリックスルー 1・7 日、エンゲージスルー 1 日、ビュースルー 1 日）を選ぶ。2026-03 からクリックスルーはリンクのクリックだけになったので、それ以前の数字と並べるときは定義の違いを書き添える（既定の組み合わせは公式に記載なし、API の既定は △）。</desc>
