<text x="38.0" y="92.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">窓の中のコンバージョンを数える</text>
<rect x="300.0" y="40.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="314.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">インクリメンタル</text>
<text x="314.0" y="92.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">増分に最適化。入札コントロール不可</text>
<rect x="576.0" y="40.0" width="260.0" height="72.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="590.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">カスタム</text>
