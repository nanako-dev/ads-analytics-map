<text x="76.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">標準のときだけ</text>
<text x="24.0" y="178.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">② 窓を選ぶ（何をきっかけに、何日まで数えるか）</text>
<text x="683.4" y="178.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">2026-03 に定義が変わった</text><rect x="667.4" y="168.0" width="10" height="10" fill="#FFA9FD"/>
