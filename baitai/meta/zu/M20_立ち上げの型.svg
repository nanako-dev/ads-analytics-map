<svg viewBox="0 0 860 542" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m20t m20d" class="fig">
<title id="m20t">M20 立ち上げの型〔当てはめ〕</title>
<desc id="m20d">週 50 件の関門から逆算すると、最適化イベントの単価は日予算 × 0.14 以下が要り、届かないイベントは一段手前に上げ、広告セットの数は週の予算 ÷（50 × 単価）まで（数字はすべて例、式は〔当てはめ〕）。手前に上げるほど事業の成果とずれるので、選んだ理由と手前から購入への率を記録する。</desc>
<rect width="860" height="542" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">〔当てはめ〕週 50 件の関門から、最適化イベントと広告セットの数を逆算する</text>
<rect x="24.0" y="44.0" width="73.0" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="38.0" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">日予算</text>
<text x="117.0" y="73.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">× 7 ÷</text>
<rect x="191.5" y="44.0" width="178.0" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<text x="205.5" y="72.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">最適化イベントの単価</text>
<text x="389.5" y="73.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="17" font-weight="700" fill="#000000" text-anchor="start">≧ 50 件 / 週</text>
<text x="534.7" y="73.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#0B8F45" text-anchor="start">→ 単価 ≦ 日予算 × 0.14</text>
<text x="24.0" y="136.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">例: 日予算 約 1 万円（週 約 7 万円）の通販。数字はすべて仮定</text>
<text x="24.0" y="172.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">カート追加</text>
<text x="24.0" y="189.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">例 単価 1,000 円</text>
<rect x="304.0" y="154.0" width="430.5" height="40.0" fill="#F5F8F4" stroke="#000000" stroke-width="1"/>
<text x="726.5" y="179.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="end">週 70 件 → 届く</text>
<text x="24.0" y="234.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="15" font-weight="700" fill="#000000" text-anchor="start">購入</text>
<text x="24.0" y="251.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">例 単価 1 万円</text>
<rect x="304.0" y="216.0" width="43.1" height="40.0" fill="#FFD6D6" stroke="#000000" stroke-width="1"/>
<text x="355.1" y="241.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">週 7 件 → 届かない</text>
<line x1="611.5" y1="144.0" x2="611.5" y2="264.0" stroke="#000000" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="611.5" y="140.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">週 50 件</text>
<line x1="304.0" y1="150.0" x2="304.0" y2="264.0" stroke="#000000" stroke-width="1.25"/>
<text x="304.0" y="282.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">0</text>
<text x="457.8" y="282.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">25</text>
<text x="611.5" y="282.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">50</text>
<text x="800.0" y="282.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">件 / 週</text>
<line x1="274.0" y1="236.0" x2="274.0" y2="187.0" stroke="#000000" stroke-width="1.5"/><path d="M274.0 180.0 L270.0 187.0 L278.0 187.0 Z" fill="#000000"/>
<text x="266.0" y="208.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="700" fill="#000000" text-anchor="end">届かなければ手前へ</text>
<text x="24.0" y="306.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">単価が 1,400 円（例: 日予算 × 0.14）以下のイベントの中で、最も深いものを選ぶ（カート追加・決済開始 など）</text>
<text x="24.0" y="352.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">置ける広告セットの数 ≦ 週の予算 ÷（50 × 単価）</text>
<rect x="24.0" y="370.0" width="580.0" height="44.0" fill="#F5F8F4" stroke="#000000" stroke-width="1.5"/>
<text x="36.0" y="390.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">広告セット 1 つ分</text>
<text x="36.0" y="407.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">50 件 × 1,000 円 ＝ 5 万円（例）</text>
<rect x="604.0" y="370.0" width="232.0" height="44.0" fill="#E6E6E6" stroke="#000000" stroke-width="1"/>
<text x="614.0" y="390.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">残り 2 万円</text>
<text x="614.0" y="407.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">2 つ目に届かない</text>
<text x="24.0" y="432.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">0</text>
<text x="604.0" y="432.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="middle">5 万</text>
<text x="836.0" y="432.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="end">7 万円 / 週</text>
<text x="24.0" y="464.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">→ 例では 1 つ。素材や訴求の違いは広告セットではなく、広告（1 広告に最大 10 素材）で持つ</text>
<rect x="24.0" y="490.0" width="10" height="10" fill="#FFE7B8"/>
<text x="42.0" y="500.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">手前に上げるほど、最適化しているものと事業の成果がずれる。選んだ理由と手前から購入への率を記録する</text>
<text x="24.0" y="532.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: 36 §4-2・§4-3 ／ M-学習-002 ／ M-予算-017 ／ 2026-11-18 時点</text>
</svg>
