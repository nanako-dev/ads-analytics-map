<text x="40.0" y="406.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">類似オーディエンス</text>
<rect x="40.0" y="422.0" width="316.5" height="30.0" fill="#C9F7DC" stroke="#000000" stroke-width="1"/><text x="52.0" y="441.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ソースは 100 人以上（1,000〜5,000 人を推奨）</text><rect x="364.5" y="422.0" width="285.6" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="376.5" y="441.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">広告セットの地域で上位 1〜20%（1% 刻み）</text><rect x="40.0" y="460.0" width="196.6" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="52.0" y="479.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">1 つのソースから最大 500 本</text><rect x="244.6" y="460.0" width="193.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="256.6" y="479.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ソースの人は類似から外れる</text><rect x="445.6" y="460.0" width="367.7" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="457.6" y="479.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">コンバージョンから作るなら 100 件以上（200 件を推奨）</text>
