<text x="54.0" y="126.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">広告主が持つデータ（ピクセル・アプリ・リストなど）</text>
<rect x="54.0" y="138.0" width="102.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="66.0" y="157.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ウェブサイト</text><rect x="164.0" y="138.0" width="154.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="176.0" y="157.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">アプリアクティビティ</text><rect x="326.0" y="138.0" width="76.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="338.0" y="157.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">カタログ</text><rect x="54.0" y="176.0" width="89.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="66.0" y="195.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">顧客リスト</text><rect x="151.0" y="176.0" width="180.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="163.0" y="195.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">オフラインアクティビティ</text><rect x="54.0" y="214.0" width="206.0" height="30.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/><text x="66.0" y="233.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">除外のみ（除外にだけ使える）</text>
