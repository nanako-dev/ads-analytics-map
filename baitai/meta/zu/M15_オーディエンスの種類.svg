<svg viewBox="0 0 860 902" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m15t m15d" class="fig">
<title id="m15t">M15 カスタムオーディエンスと類似オーディエンス</title>
<desc id="m15d">カスタムオーディエンスは自社のソース（ウェブサイト・顧客リストなど）と Meta のソース（動画・リード獲得フォームなど）に分かれ、100 人以上いれば類似オーディエンスの元にできる。保持の上限はソースで 90〜730 日と違い（ウェブサイトは 180 日と 365 日で △）、リード広告の反応者は 90 日で消えるので、長く追うなら顧客リストに移す。</desc>
<rect width="860" height="902" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">カスタムオーディエンスは 1 広告アカウントに最大 500。どれも類似オーディエンスの元にできる</text>
<rect x="24.0" y="40.0" width="812.0" height="298.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="40.0" y="68.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="16" font-weight="700" fill="#000000" text-anchor="start">カスタムオーディエンス</text>
