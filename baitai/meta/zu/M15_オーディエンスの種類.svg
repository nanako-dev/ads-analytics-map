<text x="452.0" y="108.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">Meta のソース</text>
<text x="452.0" y="126.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Facebook・Instagram・WhatsApp・Threads</text>
<rect x="452.0" y="138.0" width="50.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="464.0" y="157.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">動画</text><rect x="510.0" y="138.0" width="141.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="522.0" y="157.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">リード獲得フォーム</text><rect x="452.0" y="176.0" width="206.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="464.0" y="195.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">インスタントエクスペリエンス</text><rect x="666.0" y="176.0" width="102.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="678.0" y="195.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">ショッピング</text><rect x="452.0" y="214.0" width="161.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="464.0" y="233.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Instagram アカウント</text><rect x="621.0" y="214.0" width="76.0" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="633.0" y="233.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">イベント</text><rect x="452.0" y="252.0" width="127.5" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="464.0" y="271.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Facebook ページ</text><rect x="587.5" y="252.0" width="140.5" height="30.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/><text x="599.5" y="271.7" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#000000" text-anchor="start">Facebook 上の出品</text>
<line x1="144.0" y1="338.0" x2="144.0" y2="371.0" stroke="#000000" stroke-width="1.5"/><path d="M144.0 378.0 L148.0 371.0 L140.0 371.0 Z" fill="#000000"/>
<text x="156.0" y="364.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ソースにする（保存済みのオーディエンスはソースにできない）</text>
