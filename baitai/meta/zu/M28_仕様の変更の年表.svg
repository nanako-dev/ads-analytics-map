<title id="m28t">M28 仕様の変更の年表（2021〜2027）</title>
<desc id="m28d">2025〜2026 年に配置の廃止、旧 ASC・AAC の廃止、詳細ターゲットの除外の廃止、クリックの定義の変更（2026-03）が続き、古い手順書・記事・学習時点の記憶はこの年表のどこかで外れる。AEM の 8 件の優先順位付けが不要になった日と、ビジネスポートフォリオへの改称日は公式に記載なし。</desc>
