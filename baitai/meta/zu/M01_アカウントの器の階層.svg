<title id="m01t">M01 アカウントの器の階層</title>
<desc id="m01d">広告は広告アカウントの中のキャンペーン → 広告セット → 広告に入り、ページ・Instagram・データセット・カタログは広告アカウントと並ぶ「資産」としてポートフォリオが持つ。代理店に渡すときは広告アカウントの権限だけでなく、名義（ページ・Instagram）とデータセットの権限もそろえる。</desc>
