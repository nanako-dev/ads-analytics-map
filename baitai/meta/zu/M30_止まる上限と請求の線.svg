<svg viewBox="0 0 860 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="m30t m30d" class="fig">
<title id="m30t">M30 広告が止まる上限と、請求だけの線</title>
<desc id="m30d">広告は予算と、キャンペーン・広告アカウントの上限予算、Meta が決める 1 日の上限予算のうち最初に達したもので止まり、支払い単位額に達しても請求されるだけで広告は続く。予算が使われないまま止まったら、Meta の 1 日の上限予算（午前 0 時にリセット）に当たっていないかを最初に見る。</desc>
<rect width="860" height="630" fill="#FFFFFF"/>
<text x="24.0" y="26.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="500" fill="#4D4D4D" text-anchor="start">広告は「予算か上限予算の低いほう」に達するまで出る。支払い単位額では止まらない</text>
<text x="748.0" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">広告主が決める</text><rect x="732.0" y="44.0" width="10.0" height="10.0" fill="#FFFFFF" stroke="#000000" stroke-width="0.75"/><text x="634.3" y="54.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="400" fill="#4D4D4D" text-anchor="start">Meta が決める</text><rect x="618.3" y="44.0" width="10.0" height="10.0" fill="#FFE7B8" stroke="#000000" stroke-width="0.75"/>
<text x="24.0" y="90.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">消化額 ↓（線の並びは例）</text>
<rect x="24.0" y="104.0" width="150.0" height="202.4" fill="#F5F8F4" stroke="#000000" stroke-width="1.25"/>
<rect x="24.0" y="306.4" width="150.0" height="237.6" fill="#FFFFFF" stroke="#909A8B" stroke-width="1" stroke-dasharray="4 3"/>
<text x="36.0" y="132.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">配信される</text>
<text x="36.0" y="336.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">ここから先は</text>
<text x="36.0" y="356.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="400" fill="#4D4D4D" text-anchor="start">出ない</text>
<line x1="20.0" y1="192.0" x2="244.0" y2="192.0" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="244.0" y="166.0" width="592.0" height="52.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<rect x="256.0" y="179.0" width="10" height="10" fill="#FFA9FD"/>
<text x="272.0" y="189.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">支払い単位額</text>
<text x="256.0" y="209.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">請求されるだけ。広告は続く</text>
<line x1="20.0" y1="306.4" x2="244.0" y2="306.4" stroke="#000000" stroke-width="2"/>
<rect x="244.0" y="280.4" width="592.0" height="52.0" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="256.0" y="303.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">予算（日予算・通算予算）</text>
<text x="256.0" y="323.4" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">最初に達した線。配信が止まる</text>
<line x1="20.0" y1="376.8" x2="244.0" y2="376.8" stroke="#000000" stroke-width="2"/>
<rect x="244.0" y="350.8" width="592.0" height="52.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="256.0" y="373.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">キャンペーンの上限予算</text>
<text x="256.0" y="393.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">キャンペーン内のすべてが止まる</text>
<line x1="20.0" y1="447.2" x2="244.0" y2="447.2" stroke="#000000" stroke-width="2"/>
<rect x="244.0" y="421.2" width="592.0" height="52.0" fill="#FFE7B8" stroke="#000000" stroke-width="1"/>
<text x="256.0" y="444.2" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">1 日の上限予算</text>
<text x="256.0" y="464.2" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">一時停止。午前 0 時にリセットして再開</text>
<line x1="20.0" y1="508.8" x2="244.0" y2="508.8" stroke="#000000" stroke-width="2"/>
<rect x="244.0" y="482.8" width="592.0" height="52.0" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
<text x="256.0" y="505.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">広告アカウントの上限予算</text>
<text x="256.0" y="525.8" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12.5" font-weight="400" fill="#4D4D4D" text-anchor="start">全キャンペーンが止まる。手動でリセット</text>
<rect x="24.0" y="578.0" width="10" height="10" fill="#19E76E"/>
<text x="42.0" y="588.0" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="start">予算が残っているのに止まったら、Meta の 1 日の上限予算に達していないかを見る</text>
<text x="24.0" y="620.0" font-family="'Chivo Mono',ui-monospace,Menlo,monospace" font-size="11.5" font-weight="400" fill="#676E64" text-anchor="start">出典: ヘルプ 998181913623584・196976447912140 ／ M-アカウント-020 ／ 02 §7-1・§7-2 ／ 2026-11-18 時点</text>
</svg>
