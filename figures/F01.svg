<svg viewBox="0 0 860 688" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="f01t f01d" class="fig">
<title id="f01t">F01 アカウントの状態の判定</title>
<desc id="f01d">問0 広告は出ているか → はいなら 状0（止まっている）。問1 計測は信用できるか（4 つの検査のどれかに当たるか） → はいなら 状1（計測が信用できない）。問2 教えている中身は利益につながっているか（3 つの検査のどれかに当たるか） → はいなら 状2（教える中身がずれている）。問3 過渡の最中か → はいなら 状8（過渡（待つ））。問4 件数は足りるか → はいなら 状3（データが足りない）。問5 効率は目標内か → はいなら 状5（効率が悪い）。問6 量は計画に届いているか → はいなら 状4（制約で詰まっている）。問7 足す先があり、足しても採算が合うか → はいなら 状6（伸ばせる）。どれにも当たらなければ 状7（頭打ち（維持））。</desc>
<rect width="860" height="688" fill="#FFFFFF"/>
<text x="24" y="30" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="start">問い（上から順に当てる）</text>
<text x="552" y="30" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="12" font-weight="500" fill="#4D4D4D" text-anchor="start">状態（最初に「はい」になった所）</text>
<circle cx="556" cy="52" r="4" fill="#DC2626"/>
<text x="565" y="56" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="11" font-weight="400" fill="#4D4D4D" text-anchor="start">直す（上流）</text>
<circle cx="648" cy="52" r="4" fill="#8F8F8F"/>
<text x="657" y="56" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="11" font-weight="400" fill="#4D4D4D" text-anchor="start">待つ・足りない</text>
<circle cx="751" cy="52" r="4" fill="#D97706"/>
<text x="760" y="56" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" font-size="11" font-weight="400" fill="#4D4D4D" text-anchor="start">効率・量</text>
